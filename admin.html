<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ToBOOSTAi - Web3 Admin Console</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdfa', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' },
            ton: { 400: '#38bdf8', 500: '#0284c7' },
            dark: { 950: '#020617', 900: '#0f172a', 850: '#1e293b', 800: '#334155' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #020617; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glow-cyan { box-shadow: 0 0 35px -5px rgba(20, 184, 166, 0.3); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="selection:bg-teal-500/30 selection:text-teal-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const DEFAULT_PIN = "TOBOOST_SECRET_2025";
    const API_ENDPOINT = "/api/admin";

    // Clean SVGs
    const Icons = {
      Lock: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" strokeWidth="2"/><path d="M7 11V7a5 5 0 0110 0v4" strokeWidth="2"/></svg>,
      Shield: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>,
      Coins: () => <svg className="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="8" cy="8" r="6" strokeWidth="2"/><circle cx="16" cy="16" r="6" strokeWidth="2"/></svg>,
      Tasks: () => <svg className="w-5 h-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>,
      Users: () => <svg className="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      Copy: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" strokeWidth="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" strokeWidth="2"/></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
      X: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18" strokeWidth="2.5"/><line x1="6" y1="6" x2="18" y2="18" strokeWidth="2.5"/></svg>,
      Refresh: ({ spin }) => <svg className={`w-4 h-4 ${spin ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
      Trash: () => <svg className="w-4 h-4 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><polyline points="3 6 5 6 21 6" strokeWidth="2"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" strokeWidth="2"/></svg>,
      ChevronDown: () => <svg className="w-5 h-5 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><polyline points="6 9 12 15 18 9" strokeWidth="2"/></svg>,
      Folder: () => <svg className="w-5 h-5 text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>,
      LogOut: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    };

    function App() {
      const [adminKey, setAdminKey] = useState(() => localStorage.getItem('tob_admin_key') || '');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      const [folderOpen, setFolderOpen] = useState({
        overview: true,
        withdrawals: true,
        tasks: false,
        users: false
      });

      const toggleFolder = (key) => {
        setFolderOpen(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const [stats, setStats] = useState({ pendingWithdrawals: 0, activeTasks: 0 });
      const [withdrawals, setWithdrawals] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [withdrawalFilter, setWithdrawalFilter] = useState('pending');
      const [isLoading, setIsLoading] = useState(false);
      const [copiedId, setCopiedId] = useState(null);

      const [userSearchQuery, setUserSearchQuery] = useState('');
      const [lookedUpUser, setLookedUpUser] = useState(null);
      const [pointsDelta, setPointsDelta] = useState('');
      const [toasts, setToasts] = useState([]);
      const [referralList, setReferralList] = useState(null);
      const [isReferralModalOpen, setIsReferralModalOpen] = useState(false);
      const [isReferralLoading, setIsReferralLoading] = useState(false);

      const handleViewReferrals = async (targetUserId) => {
        if (!targetUserId) return;
        setIsReferralLoading(true);
        setIsReferralModalOpen(true);
        setReferralList([]);
        const key = localStorage.getItem('tob_admin_key') || adminKey;
        try {
          const res = await fetch(`${API_ENDPOINT}?action=get_referrals&userId=${encodeURIComponent(targetUserId)}`, {
            headers: { 'x-admin-key': key }
          });
          const d = await res.json();
          if (res.ok && d.success) {
            setReferralList(d.referrals || []);
          } else {
            addToast(d.error || 'Failed to load referrals');
          }
        } catch (e) {
          addToast('Network error loading referrals');
        } finally {
          setIsReferralLoading(false);
        }
      };

      const addToast = (message) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const handleLogin = async (e, overrideKey) => {
        if (e) e.preventDefault();
        const key = (overrideKey !== undefined ? overrideKey : adminKey).trim();
        setIsVerifying(true);
        setLoginError('');

        try {
          const res = await fetch(`${API_ENDPOINT}?action=verify`, {
            headers: { 'x-admin-key': key }
          });
          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem('tob_admin_key', key);
            setIsAuthenticated(true);
            addToast('Welcome Admin! Master Console Unlocked.');
          } else {
            setLoginError(data.error || 'Invalid Admin Secret Key.');
          }
        } catch (err) {
          localStorage.setItem('tob_admin_key', key);
          setIsAuthenticated(true);
          addToast('Preview Mode Unlocked.');
        } finally {
          setIsVerifying(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('tob_admin_key');
        setIsAuthenticated(false);
      };

      const loadAllData = async () => {
        setIsLoading(true);
        const key = localStorage.getItem('tob_admin_key') || adminKey;

        try {
          const [resOver, resWith, resTask] = await Promise.all([
            fetch(`${API_ENDPOINT}?action=get_overview`, { headers: { 'x-admin-key': key } }).catch(() => null),
            fetch(`${API_ENDPOINT}?action=get_withdrawals`, { headers: { 'x-admin-key': key } }).catch(() => null),
            fetch(`${API_ENDPOINT}?action=get_tasks`, { headers: { 'x-admin-key': key } }).catch(() => null)
          ]);

          if (resOver && resOver.ok) {
            const d = await resOver.json();
            if (d.success) setStats(d.stats);
          }
          if (resWith && resWith.ok) {
            const d = await resWith.json();
            if (d.success) setWithdrawals(d.withdrawals);
          }
          if (resTask && resTask.ok) {
            const d = await resTask.json();
            if (d.success) setTasks(d.tasks);
          }
        } catch (err) {
          addToast('Failed to sync live Firestore data.');
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          loadAllData();
        }
      }, [isAuthenticated]);

      const handleWithdrawAction = async (wId, status, shouldRefund = false) => {
        const key = localStorage.getItem('tob_admin_key') || adminKey;
        try {
          const res = await fetch(`${API_ENDPOINT}?action=update_withdrawal`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
            body: JSON.stringify({ withdrawalId: wId, status, shouldRefund })
          });
          const d = await res.json();
          if (res.ok && d.success) {
            addToast(`Withdrawal marked as ${status.toUpperCase()}!`);
            loadAllData();
          } else {
            addToast(d.error || 'Action failed');
          }
        } catch (e) {
          addToast('Network error processing withdrawal');
        }
      };

      const handleToggleTask = async (taskId, currentActive) => {
        const key = localStorage.getItem('tob_admin_key') || adminKey;
        try {
          const res = await fetch(`${API_ENDPOINT}?action=toggle_task`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
            body: JSON.stringify({ taskId, active: !currentActive })
          });
          const d = await res.json();
          if (res.ok && d.success) {
            addToast(d.message);
            loadAllData();
          }
        } catch (e) {
          addToast('Error toggling campaign');
        }
      };

      const handleDeleteTask = async (taskId) => {
        if (!confirm('Are you sure you want to permanently delete this task?')) return;
        const key = localStorage.getItem('tob_admin_key') || adminKey;
        try {
          const res = await fetch(`${API_ENDPOINT}?action=delete_task`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
            body: JSON.stringify({ taskId })
          });
          const d = await res.json();
          if (res.ok && d.success) {
            addToast('Task deleted successfully');
            loadAllData();
          }
        } catch (e) {
          addToast('Error deleting task');
        }
      };

      const handleSearchUser = async (e) => {
        e.preventDefault();
        if (!userSearchQuery.trim()) return;
        setIsLoading(true);
        const key = localStorage.getItem('tob_admin_key') || adminKey;
        try {
          const res = await fetch(`${API_ENDPOINT}?action=get_user&userId=${encodeURIComponent(userSearchQuery.trim())}`, {
            headers: { 'x-admin-key': key }
          });
          const d = await res.json();
          if (res.ok && d.success) {
            setLookedUpUser(d.user);
            addToast('User profile found!');
          } else {
            setLookedUpUser(null);
            addToast(d.error || 'User not found in Firestore');
          }
        } catch (e) {
          addToast('Search connection failed');
        } finally {
          setIsLoading(false);
        }
      };

      const handleAdjustPoints = async (e) => {
        e.preventDefault();
        if (!pointsDelta || isNaN(pointsDelta)) return;
        const key = localStorage.getItem('tob_admin_key') || adminKey;
        try {
          const res = await fetch(`${API_ENDPOINT}?action=adjust_points`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
            body: JSON.stringify({ userId: lookedUpUser.userId, pointsDelta })
          });
          const d = await res.json();
          if (res.ok && d.success) {
            addToast(d.message);
            setLookedUpUser(p => ({ ...p, points: d.newPoints }));
            setPointsDelta('');
          }
        } catch (e) {
          addToast('Failed to adjust points');
        }
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden font-sans">
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-teal-500/10 rounded-full blur-[120px] pointer-events-none"></div>

            <div className="max-w-md w-full bg-slate-900/80 backdrop-blur-2xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl relative z-10">
              <div className="text-center mb-8">
                <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-teal-500 to-cyan-400 p-0.5 shadow-xl shadow-teal-500/20">
                  <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-teal-400">
                    <Icons.Shield />
                  </div>
                </div>
                <div className="flex items-center justify-center gap-2 mb-1">
                  <h1 className="text-2xl font-extrabold text-white tracking-tight">ToBOOSTAi</h1>
                  <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/30">
                    WEB3 CONSOLE
                  </span>
                </div>
                <p className="text-xs text-slate-400">Telegram Mini App Admin & Financial Gateway</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <label className="text-[11px] font-black text-slate-300 uppercase tracking-widest flex items-center gap-1.5">
                      <Icons.Lock />
                      <span>MASTER SECURITY KEY</span>
                    </label>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/30">
                      HMAC PROTECTED
                    </span>
                  </div>
                  
                  <div className="relative group">
                    <input
                      type="password"
                      value={adminKey}
                      onChange={(e) => setAdminKey(e.target.value)}
                      placeholder="Enter your private master secret key..."
                      className="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-teal-400 font-mono text-xs tracking-wider transition shadow-inner"
                      required
                    />
                  </div>
                  {loginError && (
                    <div className="mt-2 p-2 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-mono flex items-center gap-1.5">
                      <span>⚠️</span>
                      <span>{loginError}</span>
                    </div>
                  )}
                </div>

                <button
                  type="submit"
                  disabled={isVerifying}
                  className="w-full py-3 px-4 bg-gradient-to-r from-teal-500 via-cyan-500 to-sky-500 hover:from-teal-400 hover:to-sky-400 text-slate-950 font-black rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-teal-500/25 active:scale-98 cursor-pointer disabled:opacity-50"
                >
                  <Icons.Shield />
                  <span className="text-xs font-black uppercase tracking-wider whitespace-nowrap">
                    {isVerifying ? 'Verifying...' : 'Authorize & Unlock'}
                  </span>
                </button>

                {/* সাইবার সিকিউরিটি ফুটার (অটো-ফিল বক্স সম্পূর্ণ মুছে ফেলা হয়েছে) */}
                <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between text-[10.5px] text-slate-500">
                  <div className="flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                    <span>256-Bit Financial Gateway</span>
                  </div>
                  <span className="font-mono text-slate-600">v2.4 Secure</span>
                </div>
              </form>
            </div>
          </div>
        );
      }

      const filteredWithdrawals = withdrawals.filter(w => {
        if (withdrawalFilter === 'all') return true;
        return w.status === withdrawalFilter;
      });

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans pb-16">
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="font-extrabold text-white text-base">ToBOOSTAi</span>
              <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/20">ADMIN CONSOLE</span>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={loadAllData}
                disabled={isLoading}
                className="p-2 bg-slate-800 hover:bg-slate-700 text-teal-400 rounded-xl transition cursor-pointer"
                title="Sync Live Firestore"
              >
                <Icons.Refresh spin={isLoading} />
              </button>
              <button
                onClick={handleLogout}
                className="flex items-center gap-1 px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl text-xs font-bold transition cursor-pointer"
              >
                <Icons.LogOut />
                <span>Exit</span>
              </button>
            </div>
          </header>

          <main className="max-w-4xl w-full mx-auto p-4 space-y-4">
            
            {/* FOLDER 1: OVERVIEW */}
            <div className="rounded-2xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-lg">
              <div
                onClick={() => toggleFolder('overview')}
                className="p-4 bg-slate-900 flex items-center justify-between cursor-pointer hover:bg-slate-850/80 transition select-none"
              >
                <div className="flex items-center gap-2.5">
                  <div className="p-2 rounded-xl bg-teal-500/10 text-teal-400 border border-teal-500/20">
                    <Icons.Folder />
                  </div>
                  <div>
                    <h3 className="text-sm font-extrabold text-white">System Overview & Stats</h3>
                    <p className="text-[11px] text-slate-400">Live counts from Firestore database</p>
                  </div>
                </div>
                <div className={`text-slate-400 transform transition-transform ${folderOpen.overview ? 'rotate-180' : ''}`}>
                  <Icons.ChevronDown />
                </div>
              </div>

              {folderOpen.overview && (
                <div className="p-4 pt-0 border-t border-slate-800/80 grid grid-cols-2 gap-3 mt-3">
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-[11px] font-bold text-amber-400 uppercase tracking-wider block">Pending Withdrawals</span>
                    <span className="text-2xl font-black font-display text-white mt-0.5 block">{stats.pendingWithdrawals || withdrawals.filter(w=>w.status==='pending').length}</span>
                  </div>

                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-[11px] font-bold text-cyan-400 uppercase tracking-wider block">Active Campaigns</span>
                    <span className="text-2xl font-black font-display text-white mt-0.5 block">{stats.activeTasks || tasks.filter(t=>t.active).length}</span>
                  </div>
                </div>
              )}
            </div>

            {/* ======================================================== */}
            {/* FOLDER: ALL-IN-ONE BROADCAST (1-CLICK FIXED + CUSTOM MEDIA) */}
            {/* ======================================================== */}
            <div className="rounded-2xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-lg">
              <div
                onClick={() => toggleFolder('broadcast')}
                className="p-4 bg-slate-900 flex items-center justify-between cursor-pointer hover:bg-slate-850/80 transition select-none"
              >
                <div className="flex items-center gap-2.5">
                  <div className="p-2 rounded-xl bg-gradient-to-tr from-amber-500/20 to-orange-500/20 text-amber-400 border border-amber-500/30">
                    <Icons.Shield />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className="text-sm font-extrabold text-white">Broadcast System</h3>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">TELEGRAM BOT</span>
                    </div>
                    <p className="text-[11px] text-slate-400">1-Click daily fixed reminder OR custom manual announcement</p>
                  </div>
                </div>
                <div className={`text-slate-400 transform transition-transform ${folderOpen.broadcast ? 'rotate-180' : ''}`}>
                  <Icons.ChevronDown />
                </div>
              </div>

              {folderOpen.broadcast && (
                <div className="p-4 pt-2 border-t border-slate-800/80 space-y-4">
                  
                  {/* ১-ক্লিক ফিক্সড রিমাইন্ডার বাটন */}
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-amber-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h4 className="text-xs font-black text-amber-400 flex items-center gap-1.5">
                        <span>⚡ Daily Quick Reminder (1-Click)</span>
                      </h4>
                      <p className="text-[10.5px] text-slate-400 mt-0.5">
                        Send yesterday's fixed official photo, text & "🌟 TO BOOSTAI NOW" button instantly.
                      </p>
                    </div>

                    <button
                      onClick={async () => {
                        if (!confirm('Send yesterday\'s official fixed daily reminder to ALL users now?')) return;
                        setIsLoading(true);
                        const key = localStorage.getItem('tob_admin_key') || adminKey;
                        try {
                          addToast('Sending daily fixed reminder to all users... Please wait.');
                          const res = await fetch('/api/broadcast', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
                            body: JSON.stringify({ mode: 'default' })
                          });
                          const d = await res.json();
                          if (res.ok && d.success) addToast(d.message);
                          else addToast(d.error || 'Broadcast failed');
                        } catch (e) {
                          addToast('Network error during broadcast');
                        } finally {
                          setIsLoading(false);
                        }
                      }}
                      disabled={isLoading}
                      className="px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold rounded-xl text-xs transition cursor-pointer shadow-md shadow-amber-500/25 shrink-0 disabled:opacity-50"
                    >
                      <span>⚡ Send 1-Click Reminder</span>
                    </button>
                  </div>

                  {/* কাস্টম ম্যানুয়ালি লেখার সেকশন */}
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800/90 space-y-2.5">
                    <h4 className="text-xs font-black text-white flex items-center gap-1.5">
                      <span>✍️ Custom Announcement (Write New Text or GIF/Video)</span>
                    </h4>

                    <div>
                      <label className="text-[10px] font-bold text-slate-400 block mb-1">
                        Media Link (GIF, MP4 Video, or Photo URL - Optional):
                      </label>
                      <input
                        id="broadcast-media-url"
                        type="url"
                        placeholder="https://example.com/animation.mp4 (খালি রাখলে শুধু লেখা যাবে)"
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-400 font-mono"
                      />
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-slate-400 block mb-1">
                        Button Name:
                      </label>
                      <input
                        id="broadcast-btn-text"
                        type="text"
                        placeholder="e.g. ✨ To Do NOW or 👉 WORK NOW 👈"
                        defaultValue="✨ TO BOOSTAi NOW"
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-400 font-semibold"
                      />
                    </div>

                    <div>
                      <label className="text-[10px] font-bold text-slate-400 block mb-1">
                        Custom Message Text:
                      </label>
                      <textarea
                        id="broadcast-caption"
                        rows="3"
                        placeholder="এখানে আপনার নতুন নোটিশ বা ঘোষণা নিজের মতো টাইপ করুন..."
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-400 leading-relaxed font-sans"
                      ></textarea>
                    </div>

                    <button
                      onClick={async () => {
                        const mediaUrl = document.getElementById('broadcast-media-url')?.value || '';
                        const buttonText = document.getElementById('broadcast-btn-text')?.value || '✨ TO BOOSTAi NOW';
                        const caption = document.getElementById('broadcast-caption')?.value || '';

                        if (!caption.trim()) {
                          addToast('দয়া করে কিছু মেসেজ টাইপ করুন!');
                          return;
                        }

                        if (!confirm('Broadcast this custom message to ALL users now?')) return;
                        setIsLoading(true);
                        const key = localStorage.getItem('tob_admin_key') || adminKey;
                        try {
                          addToast('Sending custom broadcast to all users... Please wait.');
                          const res = await fetch('/api/broadcast', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
                            body: JSON.stringify({ mode: 'custom', mediaUrl, caption, buttonText })
                          });
                          const d = await res.json();
                          if (res.ok && d.success) addToast(d.message);
                          else addToast(d.error || 'Broadcast failed');
                        } catch (e) {
                          addToast('Network error during broadcast');
                        } finally {
                          setIsLoading(false);
                        }
                      }}
                      disabled={isLoading}
                      className="w-full py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl text-xs transition cursor-pointer shadow-md shadow-cyan-600/20 disabled:opacity-50"
                    >
                      <span>🚀 Send Custom Announcement</span>
                    </button>
                  </div>

                </div>
              )}
            </div>
            {/* FOLDER 2: WITHDRAWAL REQUESTS */}
            <div className="rounded-2xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-lg">
              <div
                onClick={() => toggleFolder('withdrawals')}
                className="p-4 bg-slate-900 flex items-center justify-between cursor-pointer hover:bg-slate-850/80 transition select-none"
              >
                <div className="flex items-center gap-2.5">
                  <div className="p-2 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <Icons.Coins />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className="text-sm font-extrabold text-white">Withdrawal Requests</h3>
                      <span className="px-2 py-0.5 rounded-full text-[10.5px] font-black bg-amber-500/20 text-amber-300 font-mono">
                        {withdrawals.filter(w => w.status === 'pending').length} Pending
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400">Click to expand & review wallet payouts</p>
                  </div>
                </div>
                <div className={`text-slate-400 transform transition-transform ${folderOpen.withdrawals ? 'rotate-180' : ''}`}>
                  <Icons.ChevronDown />
                </div>
              </div>

              {folderOpen.withdrawals && (
                <div className="p-4 pt-2 border-t border-slate-800/80 space-y-3">
                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
                    {['pending', 'approved', 'rejected', 'all'].map(f => (
                      <button
                        key={f}
                        onClick={() => setWithdrawalFilter(f)}
                        className={`px-3 py-1 rounded-xl text-xs font-bold capitalize transition cursor-pointer ${
                          withdrawalFilter === f
                            ? 'bg-teal-500 text-slate-950 shadow-md shadow-teal-500/20'
                            : 'bg-slate-950 text-slate-400 border border-slate-800 hover:text-white'
                        }`}
                      >
                        {f} ({f === 'all' ? withdrawals.length : withdrawals.filter(w => w.status === f).length})
                      </button>
                    ))}
                  </div>

                  {filteredWithdrawals.length === 0 ? (
                    <div className="p-6 text-center bg-slate-950 rounded-xl border border-slate-800 text-slate-500 text-xs font-medium">
                      No withdrawal records found under "{withdrawalFilter}".
                    </div>
                  ) : (
                    <div className="space-y-2.5">
                      {filteredWithdrawals.map(w => {
                        const isPending = w.status === 'pending';
                        return (
                          <div
                            key={w.id}
                            className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex flex-col gap-2.5"
                          >
                            <div className="flex items-center justify-between">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="font-extrabold text-white text-xs sm:text-sm">@{w.username || 'User'}</span>
                                <span className="text-[10px] text-slate-500 font-mono">ID: {w.userId}</span>
                                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-slate-800 text-cyan-400 border border-slate-700">
                                  Tier {w.tier || 1}
                                </span>
                              </div>
                              <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded-full border ${
                                w.status === 'pending' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' :
                                w.status === 'approved' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                                'bg-rose-500/10 text-rose-400 border-rose-500/30'
                              }`}>
                                {w.status}
                              </span>
                            </div>

                            <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800/80 flex items-center justify-between gap-2">
                              <div className="min-w-0 font-mono text-[11px] text-slate-300 break-all select-all">
                                {w.walletAddress || 'No Wallet Connected'}
                              </div>
                              {w.walletAddress && (
                                <button
                                  onClick={() => {
                                    navigator.clipboard.writeText(w.walletAddress);
                                    setCopiedId(w.id);
                                    addToast('Wallet Address Copied!');
                                    setTimeout(() => setCopiedId(null), 2000);
                                  }}
                                  className="p-1.5 shrink-0 bg-slate-800 hover:bg-slate-700 text-teal-400 rounded-md transition cursor-pointer"
                                  title="Copy Wallet Address"
                                >
                                  {copiedId === w.id ? <Icons.Check /> : <Icons.Copy />}
                                </button>
                              )}
                            </div>

                            <div className="flex items-baseline justify-between pt-1">
                              <div className="flex items-baseline gap-1.5">
                                <span className="text-base font-black font-display text-emerald-400">{w.amountGram || (w.amountPts / 10000)} $GRAM</span>
                                <span className="text-xs text-slate-400 font-semibold font-mono">({(w.amountPts || 0).toLocaleString()} PTS)</span>
                              </div>
                              <span className="text-[10px] text-slate-600 font-mono">
                                {w.createdAt ? new Date(w.createdAt).toLocaleDateString() : 'Recent'}
                              </span>
                            </div>

                            {isPending && (
                              <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-900">
                                <button
                                  onClick={() => handleWithdrawAction(w.id, 'approved', false)}
                                  className="py-2 px-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-md shadow-emerald-600/20 active:scale-95 transition flex items-center justify-center gap-1 cursor-pointer"
                                >
                                  <Icons.Check />
                                  <span>Mark Paid</span>
                                </button>

                                <button
                                  onClick={() => handleWithdrawAction(w.id, 'rejected', true)}
                                  className="py-2 px-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-bold active:scale-95 transition flex items-center justify-center gap-1 cursor-pointer"
                                >
                                  <Icons.X />
                                  <span>Reject & Refund</span>
                                </button>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* FOLDER 3: BOUNTIES & CAMPAIGNS */}
            <div className="rounded-2xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-lg">
              <div
                onClick={() => toggleFolder('tasks')}
                className="p-4 bg-slate-900 flex items-center justify-between cursor-pointer hover:bg-slate-850/80 transition select-none"
              >
                <div className="flex items-center gap-2.5">
                  <div className="p-2 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                    <Icons.Tasks />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className="text-sm font-extrabold text-white">Bounties & Task Campaigns</h3>
                      <span className="px-2 py-0.5 rounded-full text-[10.5px] font-black bg-cyan-500/20 text-cyan-300 font-mono">
                        {tasks.length} Total
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400">Click to expand & manage active campaigns</p>
                  </div>
                </div>
                <div className={`text-slate-400 transform transition-transform ${folderOpen.tasks ? 'rotate-180' : ''}`}>
                  <Icons.ChevronDown />
                </div>
              </div>

              {folderOpen.tasks && (
                <div className="p-4 pt-2 border-t border-slate-800/80 space-y-2.5">
                  {tasks.length === 0 ? (
                    <div className="p-6 text-center bg-slate-950 rounded-xl border border-slate-800 text-slate-500 text-xs font-medium">
                      No campaigns found in database.
                    </div>
                  ) : (
                    tasks.map(t => {
                      const target = t.targetViews || 100;
                      const current = t.currentViews || 0;
                      const percent = Math.min(100, Math.round((current / target) * 100));

                      return (
                        <div key={t.id} className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
                          <div className="flex items-center justify-between">
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-black uppercase ${
                              t.paidWith === 'STARS' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' :
                              t.paidWith === 'GRAM' ? 'bg-sky-500/10 text-sky-400 border border-sky-500/30' :
                              'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'
                            }`}>
                              {t.paidWith === 'STARS' ? `⭐️ ${t.cost || 300} Stars` :
                               t.paidWith === 'GRAM' ? `${t.cost || 1} $GRAM` : 'Free PTS'}
                            </span>

                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                              t.active ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-500'
                            }`}>
                              {t.active ? 'Active' : 'Completed / Paused'}
                            </span>
                          </div>

                          <h4 className="font-bold text-white text-xs sm:text-sm">{t.title}</h4>
                          <a href={t.url} target="_blank" rel="noreferrer" className="text-xs text-cyan-400 hover:underline break-all block font-mono">
                            {t.url}
                          </a>

                          <div className="space-y-1 pt-1">
                            <div className="flex justify-between text-[11px] text-slate-400 font-semibold font-mono">
                              <span>Views: {current} / {target}</span>
                              <span>{percent}%</span>
                            </div>
                            <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                              <div className="bg-cyan-500 h-full rounded-full transition-all" style={{ width: `${percent}%` }} />
                            </div>
                          </div>

                          <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-900">
                            <button
                              onClick={() => handleToggleTask(t.id, t.active)}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${
                                t.active
                                  ? 'bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                  : 'bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                              }`}
                            >
                              {t.active ? 'Pause' : 'Activate'}
                            </button>

                            <button
                              onClick={() => handleDeleteTask(t.id)}
                              className="p-1.5 text-rose-400 hover:bg-rose-500/10 rounded-lg transition cursor-pointer"
                              title="Delete Campaign"
                            >
                              <Icons.Trash />
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              )}
            </div>

            {/* FOLDER 4: USER LOOKUP & POINTS CONTROL */}
            <div className="rounded-2xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-lg">
              <div
                onClick={() => toggleFolder('users')}
                className="p-4 bg-slate-900 flex items-center justify-between cursor-pointer hover:bg-slate-850/80 transition select-none"
              >
                <div className="flex items-center gap-2.5">
                  <div className="p-2 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    <Icons.Users />
                  </div>
                  <div>
                    <h3 className="text-sm font-extrabold text-white">User Lookup & Points Manager</h3>
                    <p className="text-[11px] text-slate-400">Search user by Telegram ID and edit points</p>
                  </div>
                </div>
                <div className={`text-slate-400 transform transition-transform ${folderOpen.users ? 'rotate-180' : ''}`}>
                  <Icons.ChevronDown />
                </div>
              </div>

              {folderOpen.users && (
                <div className="p-4 pt-2 border-t border-slate-800/80 space-y-3">
                  <form onSubmit={handleSearchUser} className="flex gap-2">
                    <input
                      type="text"
                      value={userSearchQuery}
                      onChange={(e) => setUserSearchQuery(e.target.value)}
                      placeholder="Telegram User ID (e.g. 5569162716)..."
                      className="flex-1 px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-teal-400 font-mono"
                    />
                    <button
                      type="submit"
                      disabled={isLoading}
                      className="px-4 py-2.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl text-xs transition cursor-pointer shadow-md shadow-teal-500/20"
                    >
                      Search
                    </button>
                  </form>

                  {lookedUpUser && (
                    <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                      <div className="flex items-center justify-between border-b border-slate-900 pb-2">
                        <div>
                          <h4 className="font-extrabold text-white text-sm">{lookedUpUser.name || 'User'}</h4>
                          <span className="text-[11px] text-slate-500 font-mono">ID: {lookedUpUser.userId}</span>
                        </div>
                        <span className="px-2.5 py-0.5 bg-teal-500/10 text-teal-400 border border-teal-500/20 rounded-full text-xs font-bold">
                          Level {lookedUpUser.level || 1}
                        </span>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800/80">
                          <span className="text-slate-400 block text-[10px]">Points Balance</span>
                          <span className="text-sm font-bold text-amber-400 font-mono">{(lookedUpUser.points || 0).toLocaleString()} PTS</span>
                        </div>
                        <div 
                          onClick={() => handleViewReferrals(lookedUpUser.userId)}
                          className="p-2.5 rounded-lg bg-slate-900 border border-slate-800/80 hover:border-indigo-500/50 cursor-pointer transition group"
                          title="Click to view all referral details"
                        >
                          <div className="flex items-center justify-between">
                            <span className="text-slate-400 block text-[10px]">Total Referrals</span>
                            <span className="text-[10px] text-indigo-400 font-bold group-hover:underline">View 👥</span>
                          </div>
                          <span className="text-sm font-bold text-white font-mono mt-0.5 block">{lookedUpUser.referralsCount || lookedUpUser.referrals || 0} Frens</span>
                        </div>
                        <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800/80">
                          <span className="text-slate-400 block text-[10px]">Ads ({lookedUpUser.adsWatchedToday || 0}/10 Today)</span>
                          <span className="text-sm font-bold text-cyan-400 font-mono">Saved Days: {lookedUpUser.savedAdDays || 0}</span>
                        </div>
                        <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800/80">
                          <span className="text-slate-400 block text-[10px]">Streak ({lookedUpUser.checkInStreak || 0}/7 Today)</span>
                          <span className="text-sm font-bold text-emerald-400 font-mono">Saved Streaks: {lookedUpUser.savedStreaks || 0}</span>
                        </div>
                      </div>

                      <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800/80 text-xs">
                        <span className="text-slate-400 block text-[10px] mb-0.5">Wallet Address:</span>
                        <span className="font-mono text-slate-300 break-all select-all text-[11px]">
                          {lookedUpUser.walletAddress || 'No Wallet Connected Yet'}
                        </span>
                      </div>

                      <form onSubmit={handleAdjustPoints} className="pt-2 border-t border-slate-900 flex gap-2 items-center flex-wrap">
                        <span className="text-xs font-semibold text-slate-300">Quick Adjust:</span>
                        <input
                          type="number"
                          value={pointsDelta}
                          onChange={(e) => setPointsDelta(e.target.value)}
                          placeholder="e.g. +500 or -500"
                          className="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs font-mono text-white focus:outline-none w-36"
                        />
                        <button
                          type="submit"
                          className="px-3 py-1.5 bg-teal-500 hover:bg-teal-400 text-slate-950 rounded-lg text-xs font-bold transition cursor-pointer"
                        >
                          Apply Points
                        </button>
                      </form>
                    </div>
                  )}
                </div>
              )}
            </div>

          </main>

          <div className="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="p-3 bg-slate-900 border border-slate-700 text-xs text-slate-100 rounded-xl shadow-2xl pointer-events-auto flex items-center gap-2">
                <span className="text-teal-400 font-bold">✓</span>
                <span>{t.message}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
