    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      .font-display {
        font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      }

      @keyframes coin-float {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-6px) rotate(1.5deg);
        }
      }

      @keyframes coin-pulse-glow {
        0%, 100% {
          filter: drop-shadow(0 6px 14px rgba(245, 158, 11, 0.35));
        }
        50% {
          filter: drop-shadow(0 10px 24px rgba(245, 158, 11, 0.65));
        }
      }

      .animate-coin-float {
        animation: coin-float 3.2s ease-in-out infinite;
      }

      .animate-coin-glow {
        animation: coin-pulse-glow 2.4s ease-in-out infinite;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .tab-enter {
        animation: fadeIn 0.22s ease-out forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

        const dishedConcave = `${idPrefix}-dished-concave`;
        const dishedInnerShadow = `${idPrefix}-dished-inner-shadow`;
        const starFacetLight = `${idPrefix}-star-light`;
        const starFacetMid = `${idPrefix}-star-mid`;
        const starFacetDark = `${idPrefix}-star-dark`;
        const starFacetDeep = `${idPrefix}-star-deep`;
        const coinShadow = `${idPrefix}-coin-shadow`;

        return (
          <div
            className={`inline-flex items-center justify-center shrink-0 ${floating ? 'animate-coin-float' : ''} ${glow ? 'animate-coin-glow' : ''} ${className}`}
            style={{ width: size, height: size }}
          >
            <svg viewBox="0 0 100 100" width="100%" height="100%" className="w-full h-full overflow-visible drop-shadow-md">
              <defs>
                <filter id={coinShadow} x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="4" stdDeviation="3" floodColor="#92400e" floodOpacity="0.4" />
                </filter>
                <linearGradient id={outerRim} x1="15%" y1="10%" x2="85%" y2="90%">
                  <stop offset="0%" stopColor="#FFF9D2" />
                  <stop offset="20%" stopColor="#FBBF24" />
                  <stop offset="50%" stopColor="#F59E0B" />
                  <stop offset="78%" stopColor="#D97706" />
                  <stop offset="100%" stopColor="#78350F" />
                </linearGradient>
                <linearGradient id={bevelLight} x1="10%" y1="10%" x2="90%" y2="90%">
                  <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.85" />
                  <stop offset="35%" stopColor="#FDE68A" stopOpacity="0.45" />
                  <stop offset="70%" stopColor="#92400E" stopOpacity="0.2" />
                  <stop offset="100%" stopColor="#451A03" stopOpacity="0.8" />
                </linearGradient>
                <radialGradient id={dishedConcave} cx="46%" cy="38%" r="62%">
                  <stop offset="0%" stopColor="#92400E" />
                  <stop offset="30%" stopColor="#B45309" />
                  <stop offset="65%" stopColor="#D97706" />
                  <stop offset="85%" stopColor="#F59E0B" />
                  <stop offset="97%" stopColor="#FDE68A" />
                  <stop offset="100%" stopColor="#FEF3C7" />
                </radialGradient>
                <linearGradient id={dishedInnerShadow} x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor="#451A03" stopOpacity="0.6" />
                  <stop offset="50%" stopColor="#78350F" stopOpacity="0.1" />
                  <stop offset="100%" stopColor="#FFFBEB" stopOpacity="0.5" />
                </linearGradient>
                <linearGradient id={starFacetLight} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#FFFFFF" />
                  <stop offset="40%" stopColor="#FEF08A" />
                  <stop offset="100%" stopColor="#FDE047" />
                </linearGradient>
                <linearGradient id={starFacetMid} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#FDE047" />
                  <stop offset="100%" stopColor="#F59E0B" />
                </linearGradient>
                <linearGradient id={starFacetDark} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#D97706" />
                  <stop offset="100%" stopColor="#B45309" />
                </linearGradient>
                <linearGradient id={starFacetDeep} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#92400E" />
                  <stop offset="100%" stopColor="#713F12" />
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="46" fill={`url(#${outerRim})`} filter={`url(#${coinShadow})`} />
              <circle cx="50" cy="50" r="45.5" fill="none" stroke={`url(#${bevelLight})`} strokeWidth="1.5" />
              <circle cx="50" cy="50" r="42" fill="none" stroke="#78350F" strokeOpacity="0.4" strokeWidth="1" />
              <circle cx="50" cy="50" r="38.5" fill={`url(#${dishedConcave})`} />
              <circle cx="50" cy="50" r="38.5" fill="none" stroke={`url(#${dishedInnerShadow})`} strokeWidth="2.5" />
              <circle cx="50" cy="50" r="34" fill="none" stroke="#FFFBEB" strokeWidth="1.2" strokeDasharray="2 3" strokeOpacity="0.65" />
              <g id="faceted-star">
                <polygon points="50,50 50,26 44.1,41.9" fill={`url(#${starFacetLight})`} />
                <polygon points="50,50 50,26 55.9,41.9" fill={`url(#${starFacetMid})`} />
                <polygon points="50,50 72.8,42.6 55.9,41.9" fill={`url(#${starFacetMid})`} />
                <polygon points="50,50 72.8,42.6 59.5,53.1" fill={`url(#${starFacetDark})`} />
                <polygon points="50,50 64.1,69.4 59.5,53.1" fill={`url(#${starFacetDark})`} />
                <polygon points="50,50 64.1,69.4 50,60" fill={`url(#${starFacetDeep})`} />
                <polygon points="50,50 35.9,69.4 50,60" fill={`url(#${starFacetDeep})`} />
                <polygon points="50,50 35.9,69.4 40.5,53.1" fill={`url(#${starFacetMid})`} />
                <polygon points="50,50 27.2,42.6 40.5,53.1" fill={`url(#${starFacetLight})`} />
                <polygon points="50,50 27.2,42.6 44.1,41.9" fill={`url(#${starFacetLight})`} />
              </g>
              <circle cx="49.5" cy="48.5" r="3" fill="#FFFFFF" fillOpacity="0.85" />
              <circle cx="47" cy="32" r="1.8" fill="#FFFFFF" fillOpacity="0.9" />
            </svg>
          </div>
        );
      };

      // ==========================================
      // FILE 7: TopVerifiedBanner
      // ==========================================
      const TopVerifiedBanner = ({ onOpenChannel }) => (
        <header className="sticky top-0 z-30 w-full bg-white/95 backdrop-blur-md border-b border-sky-100 shadow-[0_2px_10px_rgba(56,189,248,0.06)] px-4 py-2.5 transition-all">
          <div className="max-w-md mx-auto flex items-center justify-between">
            <div className="flex items-center gap-1.5">
              <div className="w-6 h-6 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white shadow-sm">
                <Icons.Send className="w-3.5 h-3.5 -translate-x-[0.5px] translate-y-[0.5px]" />
              </div>
              <div className="flex items-center gap-1.5">
                <span className="font-display font-extrabold text-slate-900 tracking-tight text-base sm:text-lg">
                  ToBOOSTAi
                </span>
                <svg className="w-4 h-4 text-[#2AABEE] shrink-0" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.1 14.5l-4.2-4.2 1.41-1.41 2.79 2.79 6.29-6.29 1.41 1.41-7.7 7.7z" />

              className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-white bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 active:scale-95 transition-all rounded-full shadow-sm shadow-sky-500/25 border border-sky-400/30 cursor-pointer"
            >
              <span>@ToBOOST_Ai</span>
              <Icons.ExternalLink className="w-3 h-3 opacity-90" />
            </button>
          </div>
        </header>
      );

      // ==========================================
      // FILE 8: UserHeaderSection (Dynamic Avatar)
      // ==========================================
      const UserHeaderSection = ({
        username,
        userLevel,
        levelTitle,
        avatarUrl,
        onOpenLevelModal,
        onOpenHelpModal,
        onOpenSettingsModal,
        currentLanguage,
        onSelectLanguage,
        dict,
      }) => {
        const [langMenuOpen, setLangMenuOpen] = useState(false);
        const languages = [
          { code: 'EN', name: 'English' },
          { code: 'RU', name: 'Русский' },
          { code: 'ES', name: 'Español' },
          { code: 'ZH', name: '中文' },

        return (
          <section className="w-full px-4 pt-4 pb-2">
            <div className="flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5 min-w-0">
                <div onClick={onOpenSettingsModal} role="button" className="relative cursor-pointer group shrink-0">
                  <div className="w-11 h-11 rounded-2xl bg-gradient-to-b from-sky-400/20 to-blue-500/20 p-0.5 border border-sky-200/80 shadow-sm flex items-center justify-center bg-white overflow-hidden">
                    {avatarUrl ? (
                      <img src={avatarUrl} alt="User Avatar" className="w-full h-full object-cover rounded-[14px]" />

                      <Coin3DIcon size={36} idPrefix="header-avatar" />
                    )}
                  </div>
                  <span className="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span>
                </div>

                <div className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs font-medium text-slate-500">{dict.welcome}</span>
                  </div>
                  <button onClick={onOpenSettingsModal} className="text-left font-display font-bold text-slate-900 text-base leading-tight truncate hover:text-sky-600 transition-colors flex items-center gap-1 cursor-pointer max-w-[150px] sm:max-w-[200px]">
                    <span className="truncate">{username}</span>
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={onOpenLevelModal}
                  className="flex items-center gap-1 px-2.5 py-1 bg-gradient-to-r from-amber-50 to-amber-100/80 border border-amber-200/90 text-amber-800 rounded-full text-xs font-bold shadow-xs active:scale-95 transition-all cursor-pointer"
                >
                  <Icons.Sparkles className="w-3 h-3 text-amber-600" />
                  <span className="tabular-nums">LV.{userLevel}</span>
                </button>

                <button onClick={onOpenHelpModal} className="w-8 h-8 rounded-full bg-white/90 border border-slate-200/80 text-slate-600 hover:text-sky-600 flex items-center justify-center transition-all shadow-xs active:scale-95 cursor-pointer">
                  <Icons.HelpCircle className="w-4 h-4" />
                </button>

                <button onClick={onOpenSettingsModal} className="w-8 h-8 rounded-full bg-white/90 border border-slate-200/80 text-slate-600 hover:text-sky-600 flex items-center justify-center transition-all shadow-xs active:scale-95 cursor-pointer">
                  <Icons.Settings className="w-4 h-4" />
                </button>

                <div className="relative">
                  <button
                    onClick={() => setLangMenuOpen(!langMenuOpen)}
                    className="h-8 px-2 rounded-full bg-white/90 border border-slate-200/80 text-slate-700 hover:text-sky-600 flex items-center gap-1 text-xs font-bold transition-all shadow-xs active:scale-95 cursor-pointer"
                  >
                    <Icons.Globe className="w-3.5 h-3.5 text-slate-500" />
                    <span>{currentLanguage}</span>
                    <Icons.ChevronDown className="w-3 h-3 text-slate-400" />
                  </button>

                  {langMenuOpen && (
                    <>
                      <div className="fixed inset-0 z-40" onClick={() => setLangMenuOpen(false)} />
                      <div className="absolute right-0 mt-1.5 w-28 bg-white rounded-xl shadow-lg border border-slate-200/90 py-1 z-50">
                        {languages.map((lang) => (
                          <button
                            key={lang.code}
                            onClick={() => {
                              onSelectLanguage(lang.code);
                              setLangMenuOpen(false);
                            }}
                            className={`w-full px-3 py-1.5 text-xs text-left flex items-center justify-between hover:bg-sky-50 transition-colors ${
                              currentLanguage === lang.code ? 'text-sky-600 font-bold bg-sky-50/50' : 'text-slate-700 font-medium'
                            }`}
                          >
                            <span>{lang.name}</span>
                            <span className="text-[10px] text-slate-400 font-mono">{lang.code}</span>
                          </button>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          </section>
        );
      };

      // ==========================================
      // FILE 9: DynamicBalanceCard Component
      // ==========================================
      const DynamicBalanceCard = ({ starBalance, tokenBalance, tonEquivalent, onBoostClick, onSwapClick, dict }) => {
        const [conversionCurrency, setConversionCurrency] = useState('GRAM');
        const toggleCurrency = () => setConversionCurrency((prev) => (prev === 'GRAM' ? 'TON' : 'GRAM'));

        const formattedStars = starBalance.toLocaleString();
        const displayTokenAmount = conversionCurrency === 'GRAM' ? tokenBalance.toFixed(3) : tonEquivalent.toFixed(4);
        const currencySymbol = conversionCurrency === 'GRAM' ? '$GRAM' : '$TON';

        return (
          <div className="w-full px-4 pt-2 pb-3">
            <div className="relative overflow-hidden rounded-[20px] bg-gradient-to-br from-white via-white to-sky-50/70 border border-white/90 shadow-[0_4px_20px_rgba(56,189,248,0.12)] p-4 sm:p-5">
              <div className="absolute -top-12 -right-12 w-36 h-36 bg-sky-200/35 rounded-full blur-2xl pointer-events-none" />
              <div className="absolute -bottom-8 -left-8 w-28 h-28 bg-amber-200/25 rounded-full blur-xl pointer-events-none" />

              <div className="relative z-10 flex items-center justify-between gap-4">
                <div className="flex flex-col items-center shrink-0">
                  <div className="relative flex items-center justify-center p-1">
                    <div className="absolute inset-0 bg-amber-400/20 rounded-full blur-md animate-pulse" />
                    <Coin3DIcon size={76} idPrefix="balance-main" floating={true} glow={true} className="transform transition-transform duration-300 hover:scale-105" />
                  </div>
                  <span className="text-[10px] font-bold text-amber-700/80 tracking-wide mt-1 uppercase flex items-center gap-0.5">
                    <Icons.Sparkles className="w-2.5 h-2.5 text-amber-500" />
                    ToBOOST Star
                  </span>
                </div>

                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{dict.totalBalance}</span>
                    <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200/60">
                      <Icons.ShieldCheck className="w-3 h-3" />
                      {dict.verified}
                    </span>
                  </div>

                  <div className="flex items-baseline gap-1.5 flex-wrap">
                    <span className="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 tracking-tight tabular-nums">
                      {formattedStars}
                    </span>
                    <span className="text-xs font-extrabold text-amber-600 tracking-wide">PTS</span>
                  </div>

                  <div className="mt-2 flex items-center gap-2 flex-wrap">
                    <button
                      onClick={toggleCurrency}
                      className="group inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-sky-100/70 hover:bg-sky-100 border border-sky-200 text-sky-800 text-xs font-bold transition-all active:scale-95 cursor-pointer"
                    >
                      <span>≈ {displayTokenAmount} {currencySymbol}</span>
                      <Icons.Repeat className="w-3 h-3 text-sky-600 group-hover:rotate-180 transition-transform duration-300" />
                    </button>

                    <button
                      onClick={onBoostClick}
                      className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-gradient-to-r from-amber-500 to-amber-600 text-white text-xs font-bold shadow-xs active:scale-95 transition-all cursor-pointer"
                    >
                      <Icons.Zap className="w-3 h-3" fill="#ffffff" />
                      <span>{dict.boost}</span>
                    </button>
                  </div>

                  <div className="mt-2 text-[11px] font-medium text-slate-400 flex items-center gap-1.5 truncate">
                    <span>Rate:</span>
                    <span className="font-semibold text-slate-600 tabular-nums">10,000 ⭐ = 1 $GRAM</span>
                  </div>
                </div>
              </div>

              <div className="mt-3.5 pt-3 border-t border-slate-100/90 flex items-center justify-between text-xs">
                <div className="flex items-center gap-1.5 text-slate-500 font-medium">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping inline-block" />
                  <span>Auto-mining: <strong className="text-slate-700">Active</strong></span>
                </div>

                <button onClick={onSwapClick} className="flex items-center gap-1 text-sky-600 font-bold hover:text-sky-700 transition-colors cursor-pointer">
                  <span>{dict.convertWallet}</span>
                  <Icons.ArrowUpRight className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // FILE 10: BottomNavBar Component
      // ==========================================
      const BottomNavBar = ({ activeTab, onSelectTab, unclaimedCheckIn = false }) => {
        const tabs = [
          { id: 'home', label: 'Home', icon: Icons.Home },
          { id: 'boost', label: 'Boost', icon: Icons.Zap },
          { id: 'checkin', label: 'Check-in', icon: Icons.Calendar, badge: unclaimedCheckIn },
          { id: 'frens', label: 'Frens', icon: Icons.Users },

          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-sky-100/90 shadow-[0_-4px_20px_rgba(56,189,248,0.08)] px-2 pb-2 pt-1.5 transition-all">
            <div className="max-w-md mx-auto grid grid-cols-5 items-center justify-around">
              {tabs.map((tab) => {
                const IconComponent = tab.icon;
                const isActive = activeTab === tab.id;

                return (
                  <button
                    key={tab.id}
                    onClick={() => onSelectTab(tab.id)}
                    className={`relative flex flex-col items-center justify-center py-1 px-1 min-h-[46px] rounded-xl transition-all duration-200 cursor-pointer active:scale-90 ${
                      isActive ? 'text-sky-600' : 'text-slate-400 hover:text-slate-600'
                    }`}
                  >
                    {isActive && (
                      <span className="absolute -top-1.5 w-6 h-1 rounded-full bg-gradient-to-r from-sky-400 to-blue-600" />

                    <div className="relative flex items-center justify-center">
                      <IconComponent className={`w-5 h-5 transition-transform duration-200 ${isActive ? 'scale-110' : ''}`} />

                        <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-orange-500 rounded-full border-2 border-white animate-pulse" />
                      )}
                    </div>

                    <span className={`text-[11px] font-semibold tracking-tight mt-1 ${isActive ? 'font-bold text-sky-600' : 'text-slate-500'}`}>
                      {tab.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </nav>

                  </div>
                  <p className="text-[11px] text-slate-500 font-medium mt-0.5 truncate">

                </div>
              </div>

                <div className="flex items-start justify-between">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 flex items-center justify-center text-white shadow-xs">
                    <Icons.CalendarCheck className="w-5 h-5" />
                  </div>

                  </div>
                  <div className="flex items-center gap-1 text-[11px] font-semibold text-orange-600 mt-0.5">
                    <Icons.Flame className="w-3.5 h-3.5 text-orange-500" fill="#f97316" />
                    <span>{dict.streak} {streakDays}</span>
                    {hasCheckedInToday && <span className="text-[10px] text-emerald-600 font-bold ml-auto">Done</span>}

              <div onClick={onInviteClick} role="button" className="group relative flex flex-col justify-between p-3.5 sm:p-4 rounded-[18px] bg-white border border-sky-100 shadow-[0_2px_12px_rgba(56,189,248,0.08)] active:scale-[0.98] transition-all cursor-pointer overflow-hidden">
                <div className="flex items-start justify-between">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-xs">
                    <Icons.Users className="w-5 h-5" />
                  </div>
                  <span className="text-[11px] font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-200/70 tabular-nums">

                </div>
                <div className="mt-3">

                      <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-500" style={{ width: `${invitePercentage}%` }} />
                    </div>
                    <div className="flex justify-between items-center text-[10px] text-slate-400 font-medium">
                      <span>Next Level Perks</span>
                      <span className="font-semibold text-slate-600 tabular-nums">{currentInvites}/{requiredInvites} frens</span>
                    </div>
                  </div>
                </div>
              </div>

              <div onClick={onTasksClick} role="button" className="group relative flex flex-col justify-between p-3.5 sm:p-4 rounded-[18px] bg-white border border-sky-100 shadow-[0_2px_12px_rgba(56,189,248,0.08)] active:scale-[0.98] transition-all cursor-pointer overflow-hidden">
                <div className="flex items-start justify-between">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-400 to-teal-600 flex items-center justify-center text-white shadow-xs">
                    <Icons.CheckCircle2 className="w-5 h-5" />
                  </div>
                  <span className="text-[11px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full border border-teal-200/70 tabular-nums">
                    {completedTasksToday}/{dailyTaskLimit} Done
                  </span>
                </div>
                <div className="mt-3">
                  <div className="flex items-center justify-between">
                    <h3 className="font-display font-bold text-slate-800 text-sm group-hover:text-teal-600 transition-colors">{dict.dailyTasks}</h3>
                    <Icons.ChevronRight className="w-4 h-4 text-slate-300" />
                  </div>
                  <div className="mt-1.5 space-y-1">
                    <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                      <div className="bg-gradient-to-r from-teal-400 to-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${taskPercentage}%` }} />
                    </div>
                    <div className="flex items-center justify-between text-[10px] text-slate-500 font-medium">
                      <span>200 PTS / task</span>
                      <span className="font-bold text-teal-600">Max {dailyTaskLimit}/day</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // FILE 12: BountyTasksSection Component
      // ==========================================
      const BountyTasksSection = ({ tasks, onStartTask, onPostBountyClick, dict }) => {
        const [selectedCategory, setSelectedCategory] = useState('All');
        const categories = ['All', 'Partners', 'Social', 'Web3', 'Daily'];

        const filteredTasks = tasks.filter((task) => {
          if (selectedCategory !== 'All' && task.category !== selectedCategory) return false;
          return true;
        });

        const renderIcon = (type) => {
          switch (type) {
            case 'telegram': return <Icons.Send className="w-4 h-4 text-[#2AABEE]" />;
            case 'twitter': return <Icons.Twitter className="w-4 h-4 text-sky-500" />;
            case 'youtube': return <Icons.Youtube className="w-4 h-4 text-red-500" />;
            case 'wallet': return <Icons.Wallet className="w-4 h-4 text-indigo-500" />;
            case 'bot': return <Icons.Bot className="w-4 h-4 text-emerald-500" />;
            default: return <Coin3DIcon size={18} idPrefix={`render-ic-${type}`} />;
          }
        };

        return (
          <section className="w-full px-4 pt-3 pb-24">
            <div className="flex items-center justify-between gap-2 mb-3">
              <div className="flex items-center gap-2">
                <h2 className="font-display font-extrabold text-slate-900 text-lg tracking-tight">{dict.activeBounties}</h2>
                <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">200 PTS each</span>
              </div>
              <button
                onClick={onPostBountyClick}
                className="flex items-center gap-1 px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-full text-xs font-bold transition-all shadow-xs active:scale-95 cursor-pointer"
              >
                <Icons.Plus className="w-3.5 h-3.5 stroke-[2.5]" />
                <span>POST +</span>
              </button>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-2.5">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3 py-1 text-xs font-semibold rounded-full whitespace-nowrap transition-all cursor-pointer ${
                    selectedCategory === cat
                      ? 'bg-sky-500 text-white shadow-xs shadow-sky-500/30'
                      : 'bg-white/80 hover:bg-white text-slate-600 border border-sky-100'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="space-y-2.5">
              {filteredTasks.map((task) => (
                <div
                  key={task.id}
                  className={`p-3.5 rounded-[18px] bg-white border border-sky-100/90 shadow-[0_2px_12px_rgba(56,189,248,0.06)] flex items-center justify-between gap-3 ${
                    task.status === 'completed' ? 'opacity-70 bg-slate-50/70' : ''
                  }`}
                >
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-10 h-10 rounded-2xl bg-sky-50 border border-sky-100 flex items-center justify-center shrink-0">
                      {renderIcon(task.iconType)}
                    </div>
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-[10px] font-bold text-sky-600 uppercase tracking-wider">{task.category}</span>
                        {task.partnerName && <span className="text-[10px] text-slate-400 font-medium">· {task.partnerName}</span>}
                      </div>
                      <h4 className="font-display font-bold text-slate-800 text-sm leading-tight truncate">{task.title}</h4>
                      <div className="inline-flex items-center gap-1 mt-1 text-xs font-extrabold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200/60 tabular-nums">
                        <Coin3DIcon size={13} idPrefix={`task-coin-${task.id}`} />
                        <span>+{task.reward} PTS</span>
                      </div>
                    </div>
                  </div>

                  <div className="shrink-0">
                    {task.status === 'active' && (
                      <button
                        onClick={() => onStartTask(task.id)}
                        className="flex items-center gap-1 px-3.5 py-1.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 text-white rounded-full text-xs font-bold transition-all shadow-xs active:scale-95 whitespace-nowrap cursor-pointer"
                      >
                        <span>{task.actionText || 'Start'}</span>
                        <Icons.ExternalLink className="w-3 h-3 opacity-80" />
                      </button>
                    )}
                    {task.status === 'verifying' && (
                      <button disabled className="flex items-center gap-1 px-3.5 py-1.5 bg-amber-100 text-amber-800 rounded-full text-xs font-bold transition-all whitespace-nowrap">
                        <Icons.Loader2 className="w-3 h-3 animate-spin text-amber-600" />
                        <span>Checking (3s)</span>
                      </button>
                    )}
                    {task.status === 'completed' && (
                      <div className="flex items-center gap-1 px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-full text-xs font-bold border border-emerald-200/80 whitespace-nowrap">
                        <Icons.Check className="w-3.5 h-3.5 stroke-[2.5]" />
                        <span>Done</span>
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </section>
        );
      };

      // ==========================================
      // FILE 19: PostBountyModal (Slider & Discounts)
      // ==========================================
      const PostBountyModal = ({ isOpen, onClose, onSubmitBounty }) => {
        const [title, setTitle] = useState('');
        const [category, setCategory] = useState('Social');
        const [iconType, setIconType] = useState('telegram');
        const [partnerName, setPartnerName] = useState('');
        const [actionText, setActionText] = useState('Join Channel');
        const [actionUrl, setActionUrl] = useState('https://t.me/');
        const [currency, setCurrency] = useState('GRAM');
        const [impressions, setImpressions] = useState(100);

        if (!isOpen) return null;

        // Pricing calculation with volume discount as instructed:
        // 100 imp = 1 GRAM, 200 imp = 1.75 GRAM, 10,000 imp = 20 GRAM (Massive discount)
        // 100 imp = 300 stars, 10,000 imp = 6,000 stars (Discounted from 30k)
        // 100 imp = 10,000 PTS, 10,000 imp = 200,000 PTS (Discounted from 1M)
        const calcPrice = () => {
          const ratio = (impressions - 100) / (10000 - 100);
          if (currency === 'GRAM') {
            const cost = 1 + ratio * (20 - 1);
            return cost.toFixed(2) + ' $GRAM';
          } else if (currency === 'STARS') {
            const cost = Math.round(300 + ratio * (6000 - 300));
            return cost.toLocaleString() + ' ⭐ Stars';
          } else {
            const cost = Math.round(10000 + ratio * (200000 - 10000));
            return cost.toLocaleString() + ' PTS';
          }
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!title.trim()) return;

          onSubmitBounty({
            title: title.trim(),
            description: `Complete this ${category.toLowerCase()} mission to earn ⭐ stars!`,
            category,
            reward: 200,
            actionText: actionText.trim() || 'Start Mission',
            actionUrl: actionUrl.trim() || 'https://t.me/ToBOOST_Ai',
            iconType,
            partnerName: partnerName.trim() || undefined,
          });
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-in fade-in duration-200">
            <div className="relative w-full max-w-sm rounded-[24px] bg-white border border-sky-100 shadow-2xl p-5 overflow-hidden max-h-[90vh] overflow-y-auto no-scrollbar">
              <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-slate-900 text-white flex items-center justify-center font-black text-sm">+</div>
                  <div>
                    <h3 className="font-display font-bold text-slate-900 text-base">Post Bounty Task</h3>
                    <p className="text-[11px] text-slate-400">Launch mission with dynamic impressions</p>
                  </div>
                </div>
                <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:text-slate-600">
                  <Icons.X className="w-5 h-5" />
                </button>
              </div>

              <form onSubmit={handleSubmit} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Task Title *</label>
                  <input
                    type="text"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="e.g. Join Official Community Channel"
                    className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-sky-500 text-slate-900"
                    required
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Category</label>
                    <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-2.5 py-2 text-xs rounded-xl border border-slate-200 bg-white">
                      <option value="Social">Social</option>
                      <option value="Partners">Partners</option>
                      <option value="Web3">Web3</option>
                      <option value="Daily">Daily</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Icon</label>
                    <select value={iconType} onChange={(e) => setIconType(e.target.value)} className="w-full px-2.5 py-2 text-xs rounded-xl border border-slate-200 bg-white">
                      <option value="telegram">Telegram</option>
                      <option value="twitter">X / Twitter</option>
                      <option value="youtube">YouTube</option>
                      <option value="wallet">Wallet</option>
                      <option value="bot">AI Bot</option>
                    </select>
                  </div>
                </div>

                {/* Impression Slider & Pricing Engine */}
                <div className="p-3 rounded-2xl bg-sky-50/60 border border-sky-100">
                  <div className="flex justify-between items-center text-xs font-bold mb-1">
                    <span className="text-slate-700">Target Impressions</span>
                    <span className="text-sky-600 tabular-nums">{impressions.toLocaleString()} Views</span>
                  </div>
                  <input
                    type="range"
                    min="100"
                    max="10000"
                    step="100"
                    value={impressions}
                    onChange={(e) => setImpressions(Number(e.target.value))}
                    className="w-full accent-sky-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-400 mt-1">
                    <span>100</span>
                    <span>5,000 (Bulk Discount)</span>
                    <span>10,000</span>
                  </div>

                  <div className="mt-2.5 pt-2 border-t border-sky-100 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-slate-500 block">Payment Method:</span>
                      <div className="flex gap-1 mt-0.5">
                        {['GRAM', 'STARS', 'PTS'].map((c) => (
                          <button
                            key={c}
                            type="button"
                            onClick={() => setCurrency(c)}
                            className={`px-2 py-0.5 text-[10px] font-bold rounded-md ${
                              currency === c ? 'bg-sky-500 text-white' : 'bg-white text-slate-600 border border-slate-200'
                            }`}
                          >
                            {c}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] text-emerald-600 font-bold block">Discounted Price</span>
                      <span className="font-display font-black text-sm text-slate-900">{calcPrice()}</span>
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Target Link / URL</label>
                  <input
                    type="url"
                    value={actionUrl}
                    onChange={(e) => setActionUrl(e.target.value)}
                    className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 text-slate-900"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-xs rounded-xl shadow-md active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-1.5"
                >
                  <Icons.Send className="w-3.5 h-3.5" />
                  <span>Publish Mission ({calcPrice()})</span>
                </button>
              </form>
            </div>
          </div>
        );
      };

      // ==========================================
      // FILE 20: LevelPerksModal Component
      // ==========================================
      const LevelPerksModal = ({ isOpen, onClose, userLevel, levelTitle, currentInvites, requiredInvites, multiplier }) => {
        if (!isOpen) return null;

        const levels = [
          { lvl: 1, title: 'Star Novice', perks: 'Base 5 daily tasks, 1.0x mining multiplier' },
          { lvl: 2, title: 'Boost Explorer', perks: '10 daily tasks (5 referrals required), 1.2x boost' },
          { lvl: 3, title: 'Cosmic Miner', perks: '15 daily tasks (10 referrals required), 1.4x boost' },
          { lvl: 4, title: 'Galaxy Pioneer', perks: '20 daily tasks (15 referrals required), 1.6x multiplier' },
          { lvl: 5, title: 'ToBOOST Master', perks: 'Maximum 20 tasks, 2.0x multiplier, priority airdrop' },
        ];

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
            <div className="relative w-full max-w-sm rounded-[24px] bg-white border border-sky-100 shadow-2xl p-5 overflow-hidden">
              <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-center">
                    <Icons.Trophy className="w-5 h-5 text-amber-600" />
                  </div>
                  <div>
                    <h3 className="font-display font-black text-slate-900 text-base">Level {userLevel} · {levelTitle}</h3>
                    <p className="text-[11px] text-slate-400">Current Multiplier: <strong className="text-amber-600">{multiplier}x</strong></p>
                  </div>
                </div>
                <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:text-slate-600">
                  <Icons.X className="w-5 h-5" />
                </button>
              </div>

              <div className="p-3.5 rounded-2xl bg-gradient-to-r from-amber-50 to-orange-50/50 border border-amber-200/80 mb-4">
                <div className="flex justify-between items-center text-xs mb-1.5 font-bold text-amber-900">
                  <span>Next Level: Lv.{userLevel + 1}</span>
                  <span className="tabular-nums">{currentInvites}/{requiredInvites} Invites</span>
                </div>
                <div className="w-full bg-amber-200/60 h-2 rounded-full overflow-hidden">
                  <div className="bg-gradient-to-r from-amber-500 to-orange-500 h-full rounded-full" style={{ width: `${Math.min(100, (currentInvites / requiredInvites) * 100)}%` }} />
                </div>
                <p className="text-[11px] text-amber-800/80 mt-2 font-medium">
                  Invite {Math.max(0, requiredInvites - currentInvites)} more friends to unlock higher daily tasks & boost!
                </p>
              </div>

              <div className="space-y-2 mb-4 max-h-56 overflow-y-auto no-scrollbar">
                {levels.map((item) => {
                  const isUnlocked = item.lvl <= userLevel;
                  return (
                    <div key={item.lvl} className={`p-2.5 rounded-xl border flex items-start gap-2.5 ${isUnlocked ? 'bg-sky-50/70 border-sky-200' : 'bg-white border-slate-100 opacity-60'}`}>
                      <div className={`w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-xs font-bold ${isUnlocked ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500'}`}>
                        {isUnlocked ? <Icons.Check className="w-3.5 h-3.5 stroke-[3]" /> : item.lvl}
                      </div>
                      <div className="min-w-0">
                        <span className="font-bold text-xs text-slate-900">Lv.{item.lvl} {item.title}</span>
                        <p className="text-[11px] text-slate-500 mt-0.5">{item.perks}</p>
                      </div>
                    </div>
                  );
                })}
              </div>

              <button onClick={onClose} className="w-full py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl cursor-pointer">
                Got it
              </button>
            </div>
          </div>
        );
      };

      // ==========================================
      // FILE 21: HelpModal Component
      // ==========================================
      const HelpModal = ({ isOpen, onClose }) => {
        if (!isOpen) return null;
        const faqs = [
          { q: 'What is ToBOOSTAi?', a: 'ToBOOSTAi is a Telegram Web3 Mini App where users complete bounties, watch ads, and convert earned Star PTS to $GRAM tokens.' },
          { q: 'What are the Daily Task limits?', a: 'You start with 5 daily tasks (200 PTS each). By inviting friends (5, 10, 15+), you unlock 10, 15, up to 20 tasks daily.' },
          { q: 'What are Withdrawal Rules?', a: 'To withdraw, you must: 1) Reach 10,000 PTS (1 $GRAM), 2) Complete 7 consecutive daily check-ins, 3) Watch at least 10 sponsor ads today.' },
        ];

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
            <div className="relative w-full max-w-sm rounded-[24px] bg-white border border-sky-100 shadow-2xl p-5 overflow-hidden max-h-[85vh] flex flex-col">
              <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                <div className="flex items-center gap-2">
                  <Coin3DIcon size={30} idPrefix="help-coin" />
                  <div>
                    <h3 className="font-display font-black text-slate-900 text-base">ToBOOSTAi Guide</h3>
                    <p className="text-[11px] text-slate-400">Rules & FAQ</p>
                  </div>
                </div>
                <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:text-slate-600">
                  <Icons.X className="w-5 h-5" />
                </button>
              </div>

              <div className="py-3 space-y-3 overflow-y-auto no-scrollbar flex-1">
                {faqs.map((faq, idx) => (
                  <div key={idx} className="p-3 rounded-2xl bg-sky-50/50 border border-sky-100">
                    <div className="font-display font-bold text-xs text-slate-800 mb-1">{faq.q}</div>
                    <p className="text-[11px] text-slate-600 leading-relaxed">{faq.a}</p>
                  </div>
                ))}
              </div>

              <button onClick={onClose} className="mt-2 w-full py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl cursor-pointer">
                Close Guide
              </button>
            </div>
          </div>
        );
      };

      // ==========================================
      // FILE 22: SettingsModal Component
      // ==========================================
      const SettingsModal = ({ isOpen, onClose, username, onUpdateUsername, onResetData }) => {
        const [editingName, setEditingName] = useState(username);
        const [soundEnabled, setSoundEnabled] = useState(true);
        const [hapticsEnabled, setHapticsEnabled] = useState(true);

        if (!isOpen) return null;

        const handleSave = (e) => {
          e.preventDefault();
          if (editingName.trim()) {
            onUpdateUsername(editingName.trim());
            onClose();
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
            <div className="relative w-full max-w-sm rounded-[24px] bg-white border border-sky-100 shadow-2xl p-5 overflow-hidden">
              <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 className="font-display font-black text-slate-900 text-base">Settings</h3>
                <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:text-slate-600">
                  <Icons.X className="w-5 h-5" />
                </button>
              </div>

              <div className="py-4 space-y-4">
                <form onSubmit={handleSave} className="space-y-2">
                  <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <Icons.User className="w-3.5 h-3.5 text-sky-600" />
                    <span>Telegram Profile Name</span>
                  </label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={editingName}
                      onChange={(e) => setEditingName(e.target.value)}
                      maxLength={25}
                      className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-200 text-slate-900 font-semibold"
                    />
                    <button type="submit" className="px-3 py-2 bg-sky-500 text-white rounded-xl text-xs font-bold cursor-pointer">
                      Save
                    </button>
                  </div>
                </form>

                <div className="space-y-2.5 pt-2 border-t border-slate-100">
                  <div className="flex items-center justify-between py-1">
                    <div className="flex items-center gap-2">
                      <Icons.Volume2 className="w-4 h-4 text-slate-500" />
                      <span className="text-xs font-semibold text-slate-700">Sound Effects</span>
                    </div>
                    <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-10 h-6 flex items-center rounded-full p-1 cursor-pointer ${soundEnabled ? 'bg-sky-500 justify-end' : 'bg-slate-200 justify-start'}`}>
                      <div className="w-4 h-4 rounded-full bg-white shadow-xs" />
                    </button>
                  </div>

                  <div className="flex items-center justify-between py-1">
                    <div className="flex items-center gap-2">
                      <Icons.Smartphone className="w-4 h-4 text-slate-500" />
                      <span className="text-xs font-semibold text-slate-700">Haptic Vibration</span>
                    </div>
                    <button onClick={() => setHapticsEnabled(!hapticsEnabled)} className={`w-10 h-6 flex items-center rounded-full p-1 cursor-pointer ${hapticsEnabled ? 'bg-sky-500 justify-end' : 'bg-slate-200 justify-start'}`}>
                      <div className="w-4 h-4 rounded-full bg-white shadow-xs" />
                    </button>
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-100">
                  <button
                    onClick={() => {
                      if (confirm('Reset demo stats back to default?')) {

                      <span>⭐ Stars PTS</span>
                    </div>
                  </div>
                </div>

                <div className="p-3 rounded-xl bg-sky-50/70 border border-sky-200/70">
                  <div className="text-xs text-sky-700 mb-1 font-medium">Estimated Token Payout</div>
                  <div className="flex items-center justify-between">
                    <span className="font-display font-extrabold text-xl text-sky-950 tabular-nums">{calculatedTokens}</span>
                    <div className="px-2.5 py-1 bg-white rounded-lg border border-sky-200 text-xs font-bold text-sky-700">$GRAM</div>
                  </div>
                </div>

                <div className="p-2.5 bg-amber-50 rounded-xl border border-amber-200/70 text-[11px] text-amber-900 space-y-0.5">
                  <div className="font-bold flex items-center gap-1">
                    <Icons.Lock className="w-3.5 h-3.5 text-amber-600" />
                    <span>Withdrawal Criteria:</span>
                  </div>
                  <div>• Min 10,000 PTS = 1 $GRAM | • 7-Day Check-in Streak ({streakDays}/7) | • 10 Daily Ads ({adsWatchedToday}/10)</div>
                </div>

                <button
                  onClick={handleWithdrawClick}
                  className="w-full py-3 rounded-xl font-bold text-xs bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center gap-2 cursor-pointer shadow-md"
                >
                  <span>Verify & Withdraw $GRAM</span>
                  <Icons.ArrowRight className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // ROOT APP COMPONENT (Full Orchestrator)
      // ==========================================
      const INITIAL_TASKS = [
        { id: 't-1', title: 'Subscribe to @ToBOOST_Ai Channel', category: 'Social', reward: 200, actionText: 'Join Channel', actionUrl: 'https://t.me/ToBOOST_Ai', status: 'completed', iconType: 'telegram', partnerName: 'ToBOOST Official' },
        { id: 't-2', title: 'Follow ToBOOSTAi on X / Twitter', category: 'Social', reward: 200, actionText: 'Follow @ToBOOST', actionUrl: 'https://twitter.com', status: 'completed', iconType: 'twitter', partnerName: 'Twitter Drop' },
        { id: 't-3', title: 'Connect TON Jetton Wallet', category: 'Web3', reward: 200, actionText: 'Connect', actionUrl: '#', status: 'completed', iconType: 'wallet', partnerName: 'TON Foundation' },
        { id: 't-4', title: 'Join TON Station Partner Community', category: 'Partners', reward: 200, actionText: 'Join Station', actionUrl: 'https://t.me/TONStation', status: 'active', iconType: 'telegram', partnerName: 'TON Station' },
        { id: 't-5', title: 'Visit Sponsor Web3 Showcase', category: 'Daily', reward: 200, actionText: 'Explore', actionUrl: '#', status: 'active', iconType: 'bot', partnerName: 'Sponsor Drop' },
      ];

      function App() {
        const [stats, setStats] = useState({
          username: 'Alex_Telegram',
          userLevel: 2,
          levelTitle: 'Boost Explorer',
          starBalance: 12500,
          tokenBalance: 1.25,
          tonEquivalent: 0.0043,
          streakDays: 4, // Set to 4 to demonstrate 7-day rule check
          hasCheckedInToday: false,
          completedTasksToday: 3,
          currentInvites: 7, // 7 invites gives 10 daily tasks
          requiredInvites: 10,
          adReward: 100, // Rule 8: 100 PTS per ad
          checkInReward: 100, // Rule 4: 100 PTS daily
          walletAddress: 'UQD4...9fA1',
          multiplier: 1.2,
          energy: 950,
          maxEnergy: 1000,
          adsWatchedToday: 6, // Rule 8: Mandatory 10 ads daily
          avatarUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
        });

        const [activeTab, setActiveTab] = useState('home');
        const [currentLanguage, setCurrentLanguage] = useState('EN');
        const dict = DICTIONARY[currentLanguage] || DICTIONARY.EN;

        // Modal visibility states
        const [isAdModalOpen, setIsAdModalOpen] = useState(false);
        const [isCheckInModalOpen, setIsCheckInModalOpen] = useState(false);
        const [isPostBountyOpen, setIsPostBountyOpen] = useState(false);
        const [isLevelModalOpen, setIsLevelModalOpen] = useState(false);
        const [isHelpModalOpen, setIsHelpModalOpen] = useState(false);
        const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
        const [isTaskLimitModalOpen, setIsTaskLimitModalOpen] = useState(false);
        const [withdrawAlertData, setWithdrawAlertData] = useState(null);

        const [tasks, setTasks] = useState(INITIAL_TASKS);

        // Daily Task Limit Calculation based on invites
        // 0-4 invites: 5 tasks | 5-9: 10 tasks | 10-14: 15 tasks | 15+: 20 tasks
        const getDailyTaskLimit = (invites) => {
          if (invites >= 15) return 20;
          if (invites >= 10) return 15;
          if (invites >= 5) return 10;
          return 5;
        };

        const dailyTaskLimit = getDailyTaskLimit(stats.currentInvites);

        const updateBalance = (newStarBalance) => {
          const stars = Math.max(0, newStarBalance);
          const gramTokens = Number((stars / 10000).toFixed(4));
          const ton = Number((gramTokens * 0.0035).toFixed(4));
          setStats((prev) => ({
            ...prev,
            starBalance: stars,
            tokenBalance: gramTokens,
            tonEquivalent: ton,
          }));
        };

        // Passive Energy Regeneration
        useEffect(() => {
          const timer = setInterval(() => {
            setStats((prev) => {
              if (prev.energy < prev.maxEnergy) {
                return { ...prev, energy: Math.min(prev.maxEnergy, prev.energy + 2) };
              }
              return prev;
            });
          }, 1500);
          return () => clearInterval(timer);
        }, []);

        // Task Completion Handler with Limit Check
        const handleStartTask = (taskId) => {
          if (stats.completedTasksToday >= dailyTaskLimit) {
            setIsTaskLimitModalOpen(true);
            return;
          }

          setTasks((prev) =>
            prev.map((t) => (t.id === taskId ? { ...t, status: 'verifying' } : t))
          );

          setTimeout(() => {
            setTasks((prev) =>
              prev.map((t) => (t.id === taskId ? { ...t, status: 'completed' } : t))
            );
            updateBalance(stats.starBalance + 200);
            setStats((p) => ({ ...p, completedTasksToday: p.completedTasksToday + 1 }));
            try { confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } }); } catch (e) {}
          }, 3000);
        };

        // Claim Ad Reward (Rule 8: 100 PTS + increment watched ads)
        const handleClaimAdReward = (amount) => {
          updateBalance(stats.starBalance + amount);
          setStats((p) => ({ ...p, adsWatchedToday: p.adsWatchedToday + 1 }));
        };

        // Daily Check-in Claim
        const handleClaimCheckIn = (reward) => {
          updateBalance(stats.starBalance + reward);
          setStats((p) => ({
            ...p,
            hasCheckedInToday: true,
            streakDays: p.streakDays + 1,
          }));
        };

        // Post New Bounty
        const handleAddBounty = (newBounty) => {
          const taskObj = {
            ...newBounty,
            id: 'bounty-' + Date.now(),
            status: 'active',
          };
          setTasks((prev) => [taskObj, ...prev]);
        };

        // Invite simulation (+100 PTS)
        const handleAddReferral = () => {
          setStats((p) => ({
            ...p,
            currentInvites: p.currentInvites + 1,
            starBalance: p.starBalance + 100,
          }));
        };

        return (
          <div className="min-h-screen bg-gradient-to-b from-[#d9f0fc] via-[#e6f4fc] to-[#d6effc] text-slate-800 flex flex-col justify-between items-center">
            <main className="w-full max-w-md min-h-screen bg-[#dcf0fb] shadow-2xl relative flex flex-col">
              <TopVerifiedBanner onOpenChannel={() => window.open('https://t.me/ToBOOST_Ai', '_blank')} />

              <UserHeaderSection
                username={stats.username}
                userLevel={stats.userLevel}
                levelTitle={stats.levelTitle}
                avatarUrl={stats.avatarUrl}
                onOpenLevelModal={() => setIsLevelModalOpen(true)}
                onOpenHelpModal={() => setIsHelpModalOpen(true)}
                onOpenSettingsModal={() => setIsSettingsModalOpen(true)}
                currentLanguage={currentLanguage}
                onSelectLanguage={(lang) => setCurrentLanguage(lang)}
                dict={dict}
              />

              <div className="flex-1 w-full overflow-x-hidden">
                {activeTab === 'home' && (
                  <div className="w-full flex flex-col tab-enter">
                    <DynamicBalanceCard
                      starBalance={stats.starBalance}
                      tokenBalance={stats.tokenBalance}
                      tonEquivalent={stats.tonEquivalent}
                      onBoostClick={() => setActiveTab('boost')}
                      onSwapClick={() => setActiveTab('wallet')}
                      dict={dict}
                    />

                    <QuickActionsGrid
                      adReward={stats.adReward}
                      checkInReward={stats.checkInReward}
                      streakDays={stats.streakDays}
                      hasCheckedInToday={stats.hasCheckedInToday}
                      userLevel={stats.userLevel}
                      currentInvites={stats.currentInvites}
                      requiredInvites={stats.requiredInvites}
                      completedTasksToday={stats.completedTasksToday}
                      dailyTaskLimit={dailyTaskLimit}
                      adsWatchedToday={stats.adsWatchedToday}
                      onWatchAdClick={() => setIsAdModalOpen(true)}
                      onCheckInClick={() => setIsCheckInModalOpen(true)}
                      onInviteClick={() => setActiveTab('frens')}
                      onTasksClick={() => window.scrollTo({ top: 400, behavior: 'smooth' })}
                      dict={dict}
                    />

                    <BountyTasksSection
                      tasks={tasks}
                      onStartTask={handleStartTask}
                      onPostBountyClick={() => setIsPostBountyOpen(true)}
                      dict={dict}
                    />
                  </div>
                )}

                {activeTab === 'boost' && (
                  <BoostView
                    starBalance={stats.starBalance}
                    energy={stats.energy}
                    maxEnergy={stats.maxEnergy}
                    multiplier={stats.multiplier}
                    onUpgradeBoost={(cost, id) => {
                      updateBalance(stats.starBalance - cost);
                      if (id === 'turbo') setStats((p) => ({ ...p, multiplier: Number((p.multiplier + 0.2).toFixed(1)) }));
                    }}
                    onTapToMine={() => {
                      if (stats.energy >= 5) {
                        setStats((p) => ({ ...p, energy: p.energy - 5 }));
                        updateBalance(stats.starBalance + Math.round(10 * stats.multiplier));
                      }
                    }}
                  />
                )}

                {activeTab === 'frens' && (
                  <FrensView
                    currentInvites={stats.currentInvites}
                    onAddReferral={handleAddReferral}
                    dict={dict}
                  />
                )}

                {activeTab === 'wallet' && (
                  <WalletView
                    starBalance={stats.starBalance}
                    walletAddress={stats.walletAddress}
                    streakDays={stats.streakDays}
                    adsWatchedToday={stats.adsWatchedToday}
                    onConnectWallet={(addr) => setStats((p) => ({ ...p, walletAddress: addr }))}
                    onDisconnectWallet={() => setStats((p) => ({ ...p, walletAddress: null }))}
                    onConvertStars={(amt) => updateBalance(stats.starBalance - amt)}
                    onShowAlert={(conds) => setWithdrawAlertData(conds)}
                  />
                )}
              </div>

              <BottomNavBar
                activeTab={activeTab}
                onSelectTab={(tab) => {
                  if (tab === 'checkin') setIsCheckInModalOpen(true);
                  else setActiveTab(tab);
                }}
                unclaimedCheckIn={!stats.hasCheckedInToday}
              />

              {/* MODALS */}
              <WatchAdModal
                isOpen={isAdModalOpen}
                onClose={() => setIsAdModalOpen(false)}
                onClaimReward={handleClaimAdReward}
              />

              <DailyCheckInModal
                isOpen={isCheckInModalOpen}
                onClose={() => setIsCheckInModalOpen(false)}
                currentStreak={stats.streakDays}
                hasCheckedInToday={stats.hasCheckedInToday}
                onClaimToday={handleClaimCheckIn}
              />

              <PostBountyModal
                isOpen={isPostBountyOpen}
                onClose={() => setIsPostBountyOpen(false)}
                onSubmitBounty={handleAddBounty}
              />

              <LevelPerksModal
                isOpen={isLevelModalOpen}
                onClose={() => setIsLevelModalOpen(false)}
                userLevel={stats.userLevel}
                levelTitle={stats.levelTitle}
                currentInvites={stats.currentInvites}
                requiredInvites={stats.requiredInvites}
                multiplier={stats.multiplier}
              />

              <HelpModal
                isOpen={isHelpModalOpen}
                onClose={() => setIsHelpModalOpen(false)}
              />

              <SettingsModal
                isOpen={isSettingsModalOpen}
                onClose={() => setIsSettingsModalOpen(false)}
                username={stats.username}
                onUpdateUsername={(name) => setStats((p) => ({ ...p, username: name }))}
                onResetData={() => window.location.reload()}
              />

              <TaskLimitModal
                isOpen={isTaskLimitModalOpen}
                onClose={() => setIsTaskLimitModalOpen(false)}
                dailyLimit={dailyTaskLimit}
                invites={stats.currentInvites}
                onGoToFrens={() => setActiveTab('frens')}
              />

              <WithdrawAlertModal
                isOpen={!!withdrawAlertData}
                onClose={() => setWithdrawAlertData(null)}
                conditions={withdrawAlertData}
              />
            </main>
          </div>
        );
      }

      // Root Render
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
