      };
const WalletView = ({ starBalance, walletAddress, streakDays, adsWatchedToday, savedStreaks, savedAdDays, withdrawCount = 0, onConnectWallet, onDisconnectWallet, onConvertStars, onShowAlert }) => {
        const tier = withdrawCount + 1;
        const minRequiredPts = tier * 10000;
        const minGramTokens = tier;

        const [swapAmount, setSwapAmount] = useState(minRequiredPts.toString());
        const parsedSwap = Number(swapAmount) || 0;
        const calculatedTokens = (parsedSwap / 10000).toFixed(3);

        useEffect(() => {
          setSwapAmount(minRequiredPts.toString());
        }, [minRequiredPts]);

        const handleConnectClick = () => {
          if (window.tonConnectUIInstance) {
            window.tonConnectUIInstance.openModal();
          } else {
            onConnectWallet('UQD4...9fA1');
          }
        };

        const handleDisconnectClick = () => {
          if (window.tonConnectUIInstance) {
            window.tonConnectUIInstance.disconnect();
          }
          onDisconnectWallet();
        };

        const handleWithdrawClick = () => {
          const hasWallet = !!walletAddress;
          const hasMinBalance = starBalance >= minRequiredPts && parsedSwap >= minRequiredPts && parsedSwap <= starBalance;
          const hasStreak = (savedStreaks > 0) || (streakDays >= 7);
          const hasAds = (savedAdDays >= 7);

          if (!hasWallet || !hasMinBalance || !hasStreak || !hasAds) {
            onShowAlert({
              tier,
              minRequiredPts,
              minGramTokens,
              hasWallet,
              hasMinBalance,
              hasStreak,
              hasAds,
              currentBalance: starBalance,
              currentStreak: streakDays,
              currentAds: adsWatchedToday,
              savedStreaks,
              savedAdDays,
            });
            if (!hasWallet) {
              handleConnectClick();
            }
            return;
          }

          onConvertStars(parsedSwap);
          if (typeof confetti === 'function') {
            try { confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } }); } catch (e) {}
          }
        };

        return (
          <div className="w-full px-4 pt-2 pb-20 space-y-3 tab-enter">
            
<div className="rounded-[20px] bg-white border border-sky-100 shadow-[0_3px_15px_rgba(56,189,248,0.08)] p-4">
              <div className="flex items-center justify-between mb-2.5">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-sky-50 border border-sky-100 flex items-center justify-center text-sky-600">
                    <Icons.Wallet className="w-4 h-4" />
                  </div>
                  <div>
                    <h3 className="font-display font-bold text-slate-900 text-xs sm:text-sm">Web3 Wallet</h3>
                    <p className="text-[10px] text-slate-400">{walletAddress ? 'Connected to TON Wallet' : 'Connect for $GRAM token withdrawal'}</p>
                  </div>
                </div>
                {walletAddress ? (
                  <span className="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                    <Icons.ShieldCheck className="w-3 h-3" /> Connected
                  </span>
                ) : (
                  <span className="text-[9.5px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">Not Connected</span>
                )}
              </div>

              {walletAddress ? (
                <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center justify-between">
                  <div className="min-w-0 font-mono text-[11px] font-bold text-slate-800 truncate max-w-[200px]">
                    {walletAddress ? `${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}` : 'No Wallet Connected'}
                  </div>
                  <button onClick={handleDisconnectClick} className="px-2 py-0.5 text-xs font-bold text-red-600 hover:bg-red-50 rounded-lg cursor-pointer">Disconnect</button>
                </div>
              ) : (
                <button
                  onClick={handleConnectClick}
                  className="w-full py-2.5 bg-gradient-to-r from-[#0088CC] to-[#0077B5] text-white font-bold text-xs rounded-xl shadow-xs cursor-pointer flex items-center justify-center gap-1.5 active:scale-98 transition"
                >
                  <Icons.Wallet className="w-3.5 h-3.5" />
                  <span>Connect TON Wallet</span>
                </button>
              )}
            </div>
                <div className="rounded-[20px] bg-white border border-sky-100 shadow-[0_3px_15px_rgba(56,189,248,0.08)] p-4">
              <div className="flex items-center justify-between mb-2">
                <h3 className="font-display font-bold text-slate-900 text-xs sm:text-sm flex items-center gap-1.5">
                  <Icons.ArrowDownUp className="w-3.5 h-3.5 text-sky-600" />
                  <span>Star PTS ⇄ $GRAM Withdrawal</span>
                </h3>
                <span className="text-[9.5px] font-extrabold px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">
                  Tier {tier}
                </span>
              </div>

              <div className="space-y-2.5">
                <div className="p-2.5 rounded-xl bg-slate-50 border border-slate-200/70">
                  <div className="flex items-center justify-between text-[11px] text-slate-500 mb-1">
                    <span>You Convert</span>
                    <span>Available: {starBalance.toLocaleString()} PTS</span>
                  </div>
                  <div className="flex items-center justify-between">
                    <input
                      type="number"
                      value={swapAmount}
                      onChange={(e) => setSwapAmount(e.target.value)}
                      min={minRequiredPts}
                      step={1000}
                      className="bg-transparent font-display font-extrabold text-lg text-slate-900 focus:outline-none w-1/2"
                    />
                    <div className="flex items-center gap-1 px-2 py-0.5 bg-white rounded-lg border border-slate-200 text-[11px] font-bold text-sky-700">
                      <Coin3DIcon size={13} idPrefix="swap-coin-icon" />
                      <span> POINTS</span>
                    </div>
                  </div>
                </div>

                <div className="p-2.5 rounded-xl bg-sky-50/70 border border-sky-200/70">
                  <div className="text-[11px] text-sky-700 mb-0.5 font-medium">Estimated Token Payout</div>
                  <div className="flex items-center justify-between">
                    <span className="font-display font-extrabold text-lg text-sky-950 tabular-nums">{calculatedTokens}</span>
                    <div className="px-2 py-0.5 bg-white rounded-lg border border-sky-200 text-xs font-bold text-sky-700">$GRAM</div>
                  </div>
                </div>

                <div className="p-2 bg-amber-50 rounded-xl border border-amber-200/70 text-[10.5px] text-amber-900 space-y-0.5">
                  <div className="font-bold flex items-center justify-between">
                    <span className="flex items-center gap-1">
                      <Icons.Lock className="w-3 h-3 text-amber-600" />
                      <span>Tier {tier} Mandatory Rules:</span>
                    </span>
                    <span className="text-[9.5px] bg-amber-200/70 text-amber-900 px-1.5 py-0.5 rounded-full font-bold">
                      Min {minRequiredPts.toLocaleString()} PTS
                    </span>
                  </div>
                  <div className="text-[10px] leading-relaxed">
                    • TON Wallet Connected: {walletAddress ? '✅ Connected' : '❌ Connect from Wallet tab'}<br />
                    • Minimum: {minRequiredPts.toLocaleString()} PTS = {minGramTokens} $GRAM<br />
                    • Must complete 7-Day Check-in Streak.<br />
                    • Must watch 10 Ads daily for 7 Days.
                  </div>
                </div>

                <button
                  onClick={handleWithdrawClick}
                  className="w-full py-2.5 rounded-xl font-bold text-xs bg-slate-900 hover:bg-slate-800 text-white flex items-center justify-center gap-1.5 cursor-pointer shadow-xs"
                >
                  <span>Verify & Withdraw {calculatedTokens} $GRAM</span>
                  <Icons.ArrowRight className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          </div>
        );
      };

      class ErrorBoundary extends Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true };
        }
        componentDidCatch(error, errorInfo) {
          console.error('Captured React Error:', error, errorInfo);
        }
        render() {
          if (this.state.hasError) {
            return (
              <div className="h-full w-full bg-[#dcf0fb] flex flex-col items-center justify-center p-6 text-center">
                <div className="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center mb-3">
                  <span className="text-2xl">💎</span>
                </div>
                <h2 className="text-sm font-extrabold text-slate-900 mb-1">ToBOOSTAi Reconnecting</h2>
                <p className="text-[11px] text-slate-500 mb-3 max-w-xs">Returning to your mission dashboard...</p>
                <button
                  onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                  className="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-xs rounded-full shadow-xs active:scale-95"
                >
                  Refresh Dashboard
                </button>
              </div>
            );
          }
          return this.props.children;
        }
      }

      const INITIAL_TASKS = [
        { id: 't-1', title: 'Subscribe to @ToBOOST_Ai Channel', category: 'Social', reward: 200, actionText: 'Join Channel', actionUrl: 'https://t.me/ToBOOST_Ai', status: 'active', iconType: 'telegram', partnerName: 'ToBOOST Official' },
        { id: 't-2', title: 'Follow ToBOOSTAi on X / Twitter', category: 'Social', reward: 200, actionText: 'Follow @ToBOOST', actionUrl: 'https://x.com/toboostapp', status: 'active', iconType: 'twitter', partnerName: 'Twitter Drop' },
        { id: 't-3', title: 'Join TON Station Partner Community', category: 'Partners', reward: 200, actionText: 'Join Station', actionUrl: 'https://t.me/ToBOOST_Ai', status: 'active', iconType: 'telegram', partnerName: 'TON Station' },
        { id: 't-4', title: 'Visit Sponsor Web3 Showcase', category: 'Daily', reward: 200, actionText: 'Explore', actionUrl: 'https://t.me/ToBOOST_Ai', status: 'active', iconType: 'bot', partnerName: 'Sponsor Drop' },
      ];

      function App() {
        const currentUserId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'guest';

        const [stats, setStats] = useState({
          username: tg?.initDataUnsafe?.user?.first_name || 'User',
          userLevel: 1,
          starBalance: 0,
          tokenBalance: 0,
          streakDays: 0,
          hasCheckedInToday: false,
          completedTasksToday: 0,
          currentInvites: 0,
          requiredInvites: 5,
          adReward: 100,
          checkInReward: 100,
          walletAddress: null,
          adsWatchedToday: getStoredAdCount(currentUserId),
          withdrawCount: getStoredWithdrawCount(currentUserId),
          avatarUrl: tg?.initDataUnsafe?.user?.photo_url || null,
          savedStreaks: 0,
          savedAdDays: 0,
        });

        const [activeTab, setActiveTab] = useState('home');
        const [currentLanguage, setCurrentLanguage] = useState('EN');
        const dict = DICTIONARY[currentLanguage] || DICTIONARY.EN;

        const [isCheckInModalOpen, setIsCheckInModalOpen] = useState(false);
        const [isPostBountyOpen, setIsPostBountyOpen] = useState(false);
        const [isLevelModalOpen, setIsLevelModalOpen] = useState(false);
        const [isHelpModalOpen, setIsHelpModalOpen] = useState(false);
        const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
        const [isTaskLimitModalOpen, setIsTaskLimitModalOpen] = useState(false);
        const [withdrawAlertData, setWithdrawAlertData] = useState(null);
        const [isAdLoading, setIsAdLoading] = useState(false);
        const [statusToast, setStatusToast] = useState('');

        const [tasks, setTasks] = useState(INITIAL_TASKS);
        const [completedTasksList, setCompletedTasksList] = useState([]);

        const showToast = (msg) => {
          setStatusToast(msg);
          setTimeout(() => setStatusToast(''), 3500);
        };

        const getDailyTaskLimit = (invites) => {
          if (invites >= 15) return 20;
          if (invites >= 10) return 15;
          if (invites >= 5) return 10;
          return 5;
        };

        const dailyTaskLimit = getDailyTaskLimit(stats.currentInvites);

        const updateBalance = (newStarBalance) => {
          const stars = Math.max(0, newStarBalance);
          const gramTokens = Number((stars / 10000).toFixed(4));
          setStats((prev) => ({
            ...prev,
            starBalance: stars,
            tokenBalance: gramTokens,
          }));
        };

        useEffect(() => {
          try {
            if (window.TON_CONNECT_UI) {
              const tonConnectUI = new window.TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://toboostaicom-lihr.vercel.app/tonconnect-manifest.json',
              });

              tonConnectUI.onStatusChange((wallet) => {
                if (wallet && wallet.account) {
                  // Raw অ্যাড্রেসকে সরাসরি UQ/EQ ফরম্যাটে কনভার্ট করা
                  const friendlyAddr = window.TON_CONNECT_UI ? window.TON_CONNECT_UI.toUserFriendlyAddress(wallet.account.address) : wallet.account.address;
                  setStats(p => ({ ...p, walletAddress: friendlyAddr }));
                  
                  const initData = tg?.initData || '';
                  if (initData) {
                    fetch('/api/user', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json', 'x-telegram-init-data': initData },
                      body: JSON.stringify({ initData, walletAddress: friendlyAddr })
                    }).catch(() => {});
                  }
                } else {
                  setStats(p => ({ ...p, walletAddress: null }));
                }
              });

              window.tonConnectUIInstance = tonConnectUI;
            }
          } catch (e) {}
        }, []);

        useEffect(() => {
          const todayUtc = getTodayUtc();
          const storedAdCount = getStoredAdCount(currentUserId);
          const storedDailyTaskData = getStoredDailyTaskData(currentUserId);

          setStats(p => ({
            ...p,
            adsWatchedToday: storedAdCount,
            completedTasksToday: storedDailyTaskData.count,
          }));
          setCompletedTasksList(storedDailyTaskData.completedIds);

          const initData = tg?.initData || '';
          const urlParams = new URLSearchParams(window.location.search);
          const startParam = tg?.initDataUnsafe?.start_param || 
                             urlParams.get('tgWebAppStartParam') || 
                             urlParams.get('startapp') || '';

          if (!initData) return;

          fetch('/api/user', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-telegram-init-data': initData
            },
            body: JSON.stringify({ initData, startParam })
          })
          .then(res => res.json().catch(() => ({})))
          .then(data => {
            const u = data.user || data;
            if (u && (u.userId || u.points !== undefined || u.name)) {
              let validStreak = u.checkInStreak || 0;
              let checkedToday = false;

              if (u.lastCheckInDate) {
                const lastCheckTime = Date.parse(u.lastCheckInDate);
                const todayTime = Date.parse(todayUtc);
                const diffDays = Math.floor((todayTime - lastCheckTime) / (1000 * 60 * 60 * 24));

                if (diffDays === 0) checkedToday = true;
                else if (diffDays === 1) checkedToday = false;
                else {
                  validStreak = 0;
                  checkedToday = false;
                }
              }

              const backendCompleted = Array.isArray(u.completedTasks) ? u.completedTasks : [];
              const mergedCompleted = Array.from(new Set([...storedDailyTaskData.completedIds, ...backendCompleted]));

              setStats(prev => ({
                ...prev,
                username: u.name || prev.username,
                starBalance: Number(u.points ?? u.balance ?? 0),
                tokenBalance: Number(u.points ?? u.balance ?? 0) / 10000,
                streakDays: validStreak,
                hasCheckedInToday: checkedToday,
                userLevel: u.level || 1,
                currentInvites: Number(u.referralsCount ?? u.referrals ?? u.referralCount ?? 0),
                adsWatchedToday: typeof u.adsWatchedToday === 'number' ? u.adsWatchedToday : prev.adsWatchedToday,
                walletAddress: u.walletAddress || prev.walletAddress,
                savedStreaks: u.savedStreaks || 0,
                savedAdDays: u.savedAdDays || 0
              }));

              setCompletedTasksList(mergedCompleted);
              saveStoredDailyTaskData(currentUserId, storedDailyTaskData.count, mergedCompleted);
            }
          })
          .catch(err => console.error('Error loading user profile:', err));

          fetch('/api/tasks')
            .then(res => res.json().catch(() => ({})))
            .then(data => {
              if (data && Array.isArray(data.tasks) && data.tasks.length > 0) {
                setTasks(data.tasks);
              }
            })
            .catch(err => console.error('Error loading tasks:', err));
        }, [currentUserId]);

        const handleWatchAd = async () => {
          if (isAdLoading) return;

          if (stats.adsWatchedToday >= 10) {
            showToast('⚠️ Daily limit of 10 sponsor ads reached! Resets at 00:00 UTC.');
            return;
          }

          const initData = tg?.initData || '';
          setIsAdLoading(true);
          showToast('Preparing sponsor ad...');

          try {
            const startRes = await fetch('/api/ad-start', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-telegram-init-data': initData
              },
              body: JSON.stringify({ initData })
            });
            const startData = await startRes.json().catch(() => ({}));
            if (!startRes.ok || !startData.success) {
              throw new Error(startData.error || startData.message || 'Ad session failed to start');
            }

            const sessionToken = startData.sessionId || startData.sessionToken;

            if (typeof window.show_11923110 === 'function') {
              await window.show_11923110();
            } else {
              await new Promise(r => setTimeout(r, 2000));
            }

            showToast('Verifying points reward...');
            const rewardRes = await fetch('/api/reward', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-telegram-init-data': initData
              },
              body: JSON.stringify({
                initData,
                sessionId: sessionToken,
                sessionToken: sessionToken
              })
            });
            const rewardData = await rewardRes.json().catch(() => ({}));

            if (rewardRes.ok && rewardData.success) {
              const earnedReward = rewardData.reward || 100;
              const newPoints = rewardData.points !== undefined
                ? rewardData.points
                : (rewardData.balance !== undefined ? rewardData.balance : stats.starBalance + earnedReward);

              updateBalance(newPoints);

              const nextCount = Math.min(10, stats.adsWatchedToday + 1);
              setStats(p => ({ ...p, adsWatchedToday: nextCount }));
              saveStoredAdCount(currentUserId, nextCount);

              showToast(`🎉 +${earnedReward} PTS credited! (${nextCount}/10 Watched)`);
              if (typeof confetti === 'function') {
                try { confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } }); } catch (e) {}
              }
            } else {
              showToast(rewardData.error || rewardData.message || 'Reward verification failed');
            }
          } catch (err) {
            showToast(err.message || 'Ad stream could not load');
          } finally {
            setIsAdLoading(false);
          }
        };

        const handleClaimCheckIn = async () => {
          const initData = tg?.initData || '';
          showToast('Processing daily bonus...');

          try {
            const res = await fetch('/api/daily-checkin', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-telegram-init-data': initData
              },
              body: JSON.stringify({ initData })
            });
            const data = await res.json().catch(() => ({}));

            if (res.ok && data.success) {
              const rewardAmount = data.reward || 100;
              const newBalance = data.points !== undefined
                ? data.points
                : (data.balance !== undefined ? data.balance : stats.starBalance + rewardAmount);

              updateBalance(newBalance);
              setStats(p => ({
                ...p,
                hasCheckedInToday: true,
                streakDays: data.streak || (p.streakDays + 1),
              }));
              setIsCheckInModalOpen(false);
              showToast(data.message || `🎉 +${rewardAmount} PTS daily bonus claimed!`);
              if (typeof confetti === 'function') {
                try { confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } }); } catch (e) {}
              }
            } else if (data.alreadyCheckedIn) {
              setStats(p => ({ ...p, hasCheckedInToday: true }));
              setIsCheckInModalOpen(false);
              showToast(data.message || 'Already claimed today!');
            } else {
              showToast(data.error || data.message || 'Check-in failed');
            }
          } catch (err) {
            showToast('Server error on check-in');
          }
        };

        const handleStartTask = async (taskId, url) => {
          if (stats.completedTasksToday >= dailyTaskLimit) {
            setIsTaskLimitModalOpen(true);
            return;
          }

          openSafeLink(url || 'https://t.me/ToBOOST_Ai');

          setTasks((prev) =>
            prev.map((t) => (t.id === taskId ? { ...t, status: 'verifying' } : t))
          );

          setTimeout(async () => {
            try {
              const initData = tg?.initData || '';
              const res = await fetch('/api/task-complete', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-telegram-init-data': initData
                },
                body: JSON.stringify({ initData, taskId, reward: 200 })
              });
              const data = await res.json().catch(() => ({}));

              if (res.ok && data.success) {
                const newPts = data.points !== undefined ? data.points : stats.starBalance + 200;
                updateBalance(newPts);
                
                const updatedList = completedTasksList.includes(taskId) ? completedTasksList : [...completedTasksList, taskId];
                const newCount = stats.completedTasksToday + 1;

                setCompletedTasksList(updatedList);
                setStats((p) => ({ ...p, completedTasksToday: newCount }));
                saveStoredDailyTaskData(currentUserId, newCount, updatedList);

                showToast('🎉 Task completed! +200 PTS');
                if (typeof confetti === 'function') {
                  try { confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } }); } catch (e) {}
                }
              } else {
                const updatedList = completedTasksList.includes(taskId) ? completedTasksList : [...completedTasksList, taskId];
                setCompletedTasksList(updatedList);
                saveStoredDailyTaskData(currentUserId, stats.completedTasksToday, updatedList);
                showToast(data.message || 'Task already completed!');
              }
            } catch (err) {
              setTasks((prev) =>
                prev.map((t) => (t.id === taskId ? { ...t, status: 'active' } : t))
              );
              showToast('Network error while completing task.');
            }
          }, 3000);
        };

        const handleAddBounty = async (newBounty) => {
          const initData = tg?.initData || '';
          try {
            const res = await fetch('/api/tasks', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-telegram-init-data': initData
              },
              body: JSON.stringify({
                title: newBounty.title,
                url: newBounty.actionUrl,
                category: newBounty.category,
                reward: newBounty.reward || 200,
                iconType: newBounty.iconType,
                impressions: newBounty.impressions || 100,
                cost: newBounty.cost || 0,
                paidWith: newBounty.paidWith || 'PTS'
              })
            });

            const data = await res.json().catch(() => ({}));
            if (res.ok && data.success) {
              const taskObj = {
                ...newBounty,
                id: data.task?.id || 'bounty-' + Date.now(),
                status: 'active',
              };
              setTasks((prev) => [taskObj, ...prev]);
              showToast('✅ Bounty task published & saved to Firestore!');
            } else {
              showToast(data.error || 'Failed to save bounty task');
            }
          } catch (e) {
            showToast('Network error publishing task.');
          }
        };

        const handleConvertStars = async (amount) => {
          const initData = tg?.initData || '';
          showToast('Processing secure withdrawal...');

          try {
            const res = await fetch('/api/withdraw', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-telegram-init-data': initData
              },
              body: JSON.stringify({
                initData,
                walletAddress: stats.walletAddress
              })
            });
            const data = await res.json().catch(() => ({}));

            if (res.ok && data.success) {
              const newCount = data.newWithdrawCount;
              updateBalance(stats.starBalance - amount);
              
              setStats((p) => ({ ...p, withdrawCount: newCount }));
              saveStoredWithdrawCount(currentUserId, newCount);

              // আপনার নির্দেশমতো ফ্রন্টএন্ডে শুধু একটি নোটিফিকেশনের (Toast) মাধ্যমে মেসেজটি দেখানো হবে
              showToast(`✅ ${amount.toLocaleString()} PTS Withdrawn! Next tier requires ${(newCount + 1) * 10000} PTS.`);
              
              if (typeof confetti === 'function') {
                try { confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } }); } catch (e) {}
              }
            } else {
              showToast(data.error || 'Withdrawal failed. Please try again.');
            }
          } catch (error) {
            showToast('Network error during withdrawal process.');
          }
        };

        return (
          <div className="h-full w-full max-w-md mx-auto bg-[#dcf0fb] text-slate-800 flex flex-col overflow-hidden relative select-none">
            <TopVerifiedBanner />
            <UserHeaderSection
              username={stats.username}
              userLevel={stats.userLevel}
              avatarUrl={stats.avatarUrl}
              onOpenLevelModal={() => setIsLevelModalOpen(true)}
              onOpenHelpModal={() => setIsHelpModalOpen(true)}
              onOpenSettingsModal={() => setIsSettingsModalOpen(true)}
              currentLanguage={currentLanguage}
              onSelectLanguage={(lang) => setCurrentLanguage(lang)}
              dict={dict}
            />

            <div className="flex-1 min-h-0 w-full overflow-hidden flex flex-col">
              {activeTab === 'home' && (
                <div className="flex-1 min-h-0 w-full flex flex-col overflow-hidden tab-enter">
                  <div className="shrink-0 w-full flex flex-col gap-1.5 px-3 pt-1 pb-1 overflow-hidden">
                    <DynamicBalanceCard
                      starBalance={stats.starBalance}
                      tokenBalance={stats.tokenBalance}
                      dict={dict}
                    />

                    <QuickActionsGrid
                      adReward={stats.adReward}
                      checkInReward={stats.checkInReward}
                      streakDays={stats.streakDays}
                      hasCheckedInToday={stats.hasCheckedInToday}
                      userLevel={stats.userLevel}
                      currentInvites={stats.currentInvites}
                      requiredInvites={stats.requiredInvites}
                      completedTasksToday={stats.completedTasksToday}
                      dailyTaskLimit={dailyTaskLimit}
                      adsWatchedToday={stats.adsWatchedToday}
                      onWatchAdClick={handleWatchAd}
                      onCheckInClick={() => setIsCheckInModalOpen(true)}
                      onInviteClick={() => setActiveTab('frens')}
                      onTasksClick={() => {
                        const el = document.getElementById('bounty-scroll-container');
                        if (el) el.scrollTo({ top: 0, behavior: 'smooth' });
                      }}
                      dict={dict}
                    />
                  </div>

                  <div className="w-full px-4 py-1 shrink-0 flex items-center justify-between">
                    <span className="h-[1px] flex-1 bg-sky-200/60"></span>
                    <span className="px-2 text-[10px] font-extrabold uppercase tracking-wider text-sky-600/80">
                      Missions & Bounties
                    </span>
                    <span className="h-[1px] flex-1 bg-sky-200/60"></span>
                  </div>

                  <div
                    id="bounty-scroll-container"
                    className="flex-1 min-h-0 w-full overflow-y-auto overflow-x-hidden no-scrollbar px-3 pb-16 touch-pan-y"
                    style={{ WebkitOverflowScrolling: 'touch' }}
                  >
                    <BountyTasksSection
                      tasks={tasks}
                      completedTasksList={completedTasksList}
                      onStartTask={handleStartTask}
                      onPostBountyClick={() => setIsPostBountyOpen(true)}
                      dict={dict}
                    />
                  </div>
                </div>
              )}

              {activeTab === 'frens' && (
                <div className="flex-1 min-h-0 w-full overflow-y-auto no-scrollbar touch-pan-y" style={{ WebkitOverflowScrolling: 'touch' }}>
                  <FrensView
                    currentInvites={stats.currentInvites}
                    dict={dict}
                  />
                </div>
              )}

              {activeTab === 'wallet' && (
                <div className="flex-1 min-h-0 w-full overflow-y-auto no-scrollbar touch-pan-y" style={{ WebkitOverflowScrolling: 'touch' }}>
                  <WalletView
                  starBalance={stats.starBalance}
                  walletAddress={stats.walletAddress}
                  streakDays={stats.streakDays}
                  adsWatchedToday={stats.adsWatchedToday}
                  savedStreaks={stats.savedStreaks}
                  savedAdDays={stats.savedAdDays}
                  withdrawCount={stats.withdrawCount}
                    onConnectWallet={(addr) => setStats((p) => ({ ...p, walletAddress: addr }))}
                    onDisconnectWallet={() => setStats((p) => ({ ...p, walletAddress: null }))}
                    onConvertStars={handleConvertStars}
                    onShowAlert={(conds) => setWithdrawAlertData(conds)}
                  />
                </div>
              )}
            </div>

            <BottomNavBar
              activeTab={activeTab}
              onSelectTab={(tab) => {
                if (tab === 'checkin') setIsCheckInModalOpen(true);
                else setActiveTab(tab);
              }}
              hasCheckedInToday={stats.hasCheckedInToday}
            />

            {statusToast && (
              <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2 rounded-full text-[12px] font-semibold shadow-lg">
                {statusToast}
              </div>
            )}

            <DailyCheckInModal
              isOpen={isCheckInModalOpen}
              onClose={() => setIsCheckInModalOpen(false)}
              currentStreak={stats.streakDays}
              hasCheckedInToday={stats.hasCheckedInToday}
              onClaimToday={handleClaimCheckIn}
            />

            <PostBountyModal
              isOpen={isPostBountyOpen}
              onClose={() => setIsPostBountyOpen(false)}
              starBalance={stats.starBalance}
              walletAddress={stats.walletAddress}
              onDeductPts={(cost) => updateBalance(stats.starBalance - cost)}
              onSubmitBounty={handleAddBounty}
              showToast={showToast}
            />

            <LevelPerksModal
              isOpen={isLevelModalOpen}
              onClose={() => setIsLevelModalOpen(false)}
              userLevel={stats.userLevel}
              currentInvites={stats.currentInvites}
              requiredInvites={stats.requiredInvites}
              multiplier={stats.multiplier}
            />

            <HelpModal
              isOpen={isHelpModalOpen}
              onClose={() => setIsHelpModalOpen(false)}
            />

            <SettingsModal
              isOpen={isSettingsModalOpen}
              onClose={() => setIsSettingsModalOpen(false)}
              username={stats.username}
              onUpdateUsername={(name) => setStats((p) => ({ ...p, username: name }))}
            />

            <TaskLimitModal
              isOpen={isTaskLimitModalOpen}
              onClose={() => setIsTaskLimitModalOpen(false)}
              dailyLimit={dailyTaskLimit}
              invites={stats.currentInvites}
              onGoToFrens={() => setActiveTab('frens')}
            />

            <WithdrawAlertModal
              isOpen={!!withdrawAlertData}
              onClose={() => setWithdrawAlertData(null)}
              conditions={withdrawAlertData}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    </script>
  </body>
</html>
