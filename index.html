      const tg = window.Telegram?.WebApp;
      if (tg) {
        try {
          tg.ready();

        } catch (e) {
          console.warn('Telegram init:', e);
        }

      const openSafeLink = (url) => {
        if (!url || url === '#') return;
        try {
          if (url.includes('t.me')) {
            if (window.Telegram?.WebApp?.openTelegramLink) {
              window.Telegram.WebApp.openTelegramLink(url);
              return;
            }
          }
          if (window.Telegram?.WebApp?.openLink) {
            window.Telegram.WebApp.openLink(url);
          } else {
            window.open(url, '_blank', 'noopener,noreferrer');
          }
        } catch (err) {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      };

      const getTodayUtc = () => new Date().toISOString().split('T')[0];

      const getStoredAdCount = (uid) => {
        try {
          const raw = localStorage.getItem(`toboost_ad_stats_${uid || 'guest'}`);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.date === getTodayUtc()) {
              return typeof parsed.count === 'number' ? parsed.count : 0;
            }
          }
        } catch (e) {}
        return 0;
      };

      const saveStoredAdCount = (uid, count) => {
        try {
          localStorage.setItem(`toboost_ad_stats_${uid || 'guest'}`, JSON.stringify({
            date: getTodayUtc(),
            count: count
          }));
        } catch (e) {}
      };

      const getStoredDailyTaskData = (uid) => {
        try {
          const raw = localStorage.getItem(`toboost_daily_tasks_${uid || 'guest'}`);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.date === getTodayUtc()) {
              return {
                count: typeof parsed.count === 'number' ? parsed.count : 0,
                completedIds: Array.isArray(parsed.completedIds) ? parsed.completedIds : []
              };
            }
          }
        } catch (e) {}
        return { count: 0, completedIds: [] };
      };

      const saveStoredDailyTaskData = (uid, count, completedIds) => {
        try {
          localStorage.setItem(`toboost_daily_tasks_${uid || 'guest'}`, JSON.stringify({
            date: getTodayUtc(),
            count: count,
            completedIds: completedIds
          }));
        } catch (e) {}
      };

        AlertCircle: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
        Trophy: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M6 4h12v7a6 6 0 0 1-12 0V4z"></path></svg>,
        Volume2: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>,
        Gift: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>,
        Copy: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
        Share2: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>,
        ArrowDownUp: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="m21 8-4-4-4 4"></path><path d="M17 4v16"></path></svg>,
        ArrowRight: ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>,
      };

      const Coin3DIcon = ({
        size = 36,
        className = '',
        floating = false,
        glow = false,
        idPrefix = 'toboost-blue',
      }) => {
        const outerRim = `${idPrefix}-outer-rim`;
        const bevelLight = `${idPrefix}-bevel-light`;
        const dishedConcave = `${idPrefix}-dished-concave`;
        const dishedInnerShadow = `${idPrefix}-dished-inner-shadow`;
        const starFacetLight = `${idPrefix}-star-light`;
        const starFacetMid = `${idPrefix}-star-mid`;
        const starFacetDark = `${idPrefix}-star-dark`;
        const starFacetDeep = `${idPrefix}-star-deep`;
        const coinShadow = `${idPrefix}-coin-shadow`;

        return (
          <div
            className={`inline-flex items-center justify-center shrink-0 ${floating ? 'animate-coin-float' : ''} ${glow ? 'animate-coin-glow' : ''} ${className}`}
            style={{ width: size, height: size }}
          >
            <svg viewBox="0 0 100 100" width="100%" height="100%" className="w-full h-full overflow-visible drop-shadow-md">
              <defs>
                <filter id={coinShadow} x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="3.5" stdDeviation="3" floodColor="#0284c7" floodOpacity="0.5" />
                </filter>
                <linearGradient id={outerRim} x1="15%" y1="10%" x2="85%" y2="90%">
                  <stop offset="0%" stopColor="#E0F2FE" /><stop offset="20%" stopColor="#7DD3FC" /><stop offset="50%" stopColor="#0284C7" /><stop offset="78%" stopColor="#0369A1" /><stop offset="100%" stopColor="#075985" />
                </linearGradient>
                <linearGradient id={bevelLight} x1="10%" y1="10%" x2="90%" y2="90%">
                  <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.9" /><stop offset="35%" stopColor="#BAE6FD" stopOpacity="0.5" /><stop offset="70%" stopColor="#0369A1" stopOpacity="0.3" /><stop offset="100%" stopColor="#082F49" stopOpacity="0.8" />
                </linearGradient>
                <radialGradient id={dishedConcave} cx="46%" cy="38%" r="62%">
                  <stop offset="0%" stopColor="#082F49" /><stop offset="30%" stopColor="#0C4A6E" /><stop offset="65%" stopColor="#0369A1" /><stop offset="85%" stopColor="#0284C7" /><stop offset="97%" stopColor="#7DD3FC" /><stop offset="100%" stopColor="#E0F2FE" />
                </radialGradient>
                <linearGradient id={dishedInnerShadow} x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor="#082F49" stopOpacity="0.7" /><stop offset="50%" stopColor="#0C4A6E" stopOpacity="0.2" /><stop offset="100%" stopColor="#F0F9FF" stopOpacity="0.6" />
                </linearGradient>
                <linearGradient id={starFacetLight} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#FFFFFF" /><stop offset="40%" stopColor="#E0F2FE" /><stop offset="100%" stopColor="#BAE6FD" />
                </linearGradient>
                <linearGradient id={starFacetMid} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#BAE6FD" /><stop offset="100%" stopColor="#38BDF8" />
                </linearGradient>
                <linearGradient id={starFacetDark} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#0284C7" /><stop offset="100%" stopColor="#0369A1" />
                </linearGradient>
                <linearGradient id={starFacetDeep} x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#075985" /><stop offset="100%" stopColor="#0C4A6E" />
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="46" fill={`url(#${outerRim})`} filter={`url(#${coinShadow})`} />
              <circle cx="50" cy="50" r="45.5" fill="none" stroke={`url(#${bevelLight})`} strokeWidth="1.5" />
              <circle cx="50" cy="50" r="42" fill="none" stroke="#082F49" strokeOpacity="0.4" strokeWidth="1" />
              <circle cx="50" cy="50" r="38.5" fill={`url(#${dishedConcave})`} />
              <circle cx="50" cy="50" r="38.5" fill="none" stroke={`url(#${dishedInnerShadow})`} strokeWidth="2.5" />
              <circle cx="50" cy="50" r="34" fill="none" stroke="#F0F9FF" strokeWidth="1.2" strokeDasharray="2 3" strokeOpacity="0.75" />
              <g id="faceted-star">
                <polygon points="50,50 50,26 44.1,41.9" fill={`url(#${starFacetLight})`} />
                <polygon points="50,50 50,26 55.9,41.9" fill={`url(#${starFacetMid})`} />
                <polygon points="50,50 72.8,42.6 55.9,41.9" fill={`url(#${starFacetMid})`} />
                <polygon points="50,50 72.8,42.6 59.5,53.1" fill={`url(#${starFacetDark})`} />
                <polygon points="50,50 64.1,69.4 59.5,53.1" fill={`url(#${starFacetDark})`} />
                <polygon points="50,50 64.1,69.4 50,60" fill={`url(#${starFacetDeep})`} />
                <polygon points="50,50 35.9,69.4 50,60" fill={`url(#${starFacetDeep})`} />
                <polygon points="50,50 35.9,69.4 40.5,53.1" fill={`url(#${starFacetMid})`} />
                <polygon points="50,50 27.2,42.6 40.5,53.1" fill={`url(#${starFacetLight})`} />
                <polygon points="50,50 27.2,42.6 44.1,41.9" fill={`url(#${starFacetLight})`} />
              </g>
              <circle cx="49.5" cy="48.5" r="3" fill="#FFFFFF" fillOpacity="0.9" />
              <circle cx="47" cy="32" r="1.8" fill="#FFFFFF" fillOpacity="0.95" />
            </svg>
          </div>
        );
      };

      const TopVerifiedBanner = () => (
        <header className="sticky top-0 z-30 w-full bg-white/95 backdrop-blur-md border-b border-sky-100 shadow-[0_1px_8px_rgba(56,189,248,0.06)] px-3.5 py-1.5 shrink-0 transition-all">
          <div className="max-w-md mx-auto flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-6 h-6 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white shadow-xs">
                <Icons.Send className="w-3.5 h-3.5 -translate-x-[0.5px] translate-y-[0.5px]" />
              </div>
              <div className="flex items-center gap-1.5">
                <span className="font-display font-black text-slate-900 tracking-tight text-[16px]">
                  ToBOOSTAi
                </span>
                <svg className="w-4 h-4 text-[#2AABEE] shrink-0" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.1 14.5l-4.2-4.2 1.41-1.41 2.79 2.79 6.29-6.29 1.41 1.41-7.7 7.7z" />
                </svg>
              </div>
            </div>

            <button
              onClick={() => openSafeLink('https://t.me/ToBOOST_Ai')}
              className="flex items-center gap-1.5 px-3 py-1 text-[12px] font-bold text-white bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 active:scale-95 transition-all rounded-full shadow-xs shadow-sky-500/25 border border-sky-400/30 cursor-pointer"
            >
              <Icons.Send className="w-3 h-3 -translate-x-[0.5px] translate-y-[0.5px]" />
              <span>Community</span>
              <Icons.ExternalLink className="w-3 h-3 opacity-90" />
            </button>
          </div>
        </header>
      );

      const UserHeaderSection = ({
        username,
        userLevel,
        avatarUrl,
        onOpenLevelModal,
        onOpenHelpModal,
        onOpenSettingsModal,
        currentLanguage,
        onSelectLanguage,
        dict,
      }) => {
        const [langMenuOpen, setLangMenuOpen] = useState(false);
        const languages = [
          { code: 'EN', name: 'English' },
          { code: 'RU', name: 'Русский' },
          { code: 'ES', name: 'Español' },
          { code: 'ZH', name: '中文' },
        ];

        return (
          <section className="w-full px-3.5 py-1 shrink-0">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0">
                <div onClick={onOpenSettingsModal} role="button" className="relative cursor-pointer group shrink-0">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-b from-sky-400/20 to-blue-500/20 p-0.5 border border-sky-200/80 shadow-xs flex items-center justify-center bg-white overflow-hidden">
                    {avatarUrl ? (
                      <img src={avatarUrl} alt="Avatar" className="w-full h-full object-cover rounded-[10px]" />
                    ) : (
                      <span className="font-display font-bold text-sky-600 text-sm">{(username || 'U')[0].toUpperCase()}</span>
                    )}
                  </div>
                  <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"></span>
                </div>

                <div className="min-w-0">
                  <div className="flex items-center gap-1">
                    <span className="text-[12px] font-medium text-slate-500">{dict.welcome}</span>
                  </div>
                  <button onClick={onOpenSettingsModal} className="text-left font-display font-bold text-slate-900 text-[14px] leading-tight truncate hover:text-sky-600 transition-colors flex items-center gap-1 cursor-pointer max-w-[130px] sm:max-w-[200px]">
                    <span className="truncate">{username}</span>
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={onOpenLevelModal}
                  className="flex items-center gap-1 px-2.5 py-1 bg-gradient-to-r from-sky-50 to-blue-100/80 border border-sky-200/90 text-sky-800 rounded-full text-[12px] font-bold shadow-xs active:scale-95 transition-all cursor-pointer"
                >
                  <Icons.Sparkles className="w-3.5 h-3.5 text-sky-600" />
                  <span className="tabular-nums">LV.{userLevel}</span>
                </button>

                <button onClick={onOpenHelpModal} className="w-7 h-7 rounded-full bg-white/90 border border-slate-200/80 text-slate-600 hover:text-sky-600 flex items-center justify-center transition-all shadow-xs active:scale-95 cursor-pointer">
                  <Icons.HelpCircle className="w-4 h-4" />
                </button>

                <button onClick={onOpenSettingsModal} className="w-7 h-7 rounded-full bg-white/90 border border-slate-200/80 text-slate-600 hover:text-sky-600 flex items-center justify-center transition-all shadow-xs active:scale-95 cursor-pointer">
                  <Icons.Settings className="w-4 h-4" />
                </button>

                <div className="relative">
                  <button
                    onClick={() => setLangMenuOpen(!langMenuOpen)}
                    className="h-7 px-2 rounded-full bg-white/90 border border-slate-200/80 text-slate-700 hover:text-sky-600 flex items-center gap-1 text-[11px] font-bold transition-all shadow-xs active:scale-95 cursor-pointer"
                  >
                    <Icons.Globe className="w-3 h-3 text-slate-500" />
                    <span>{currentLanguage}</span>
                    <Icons.ChevronDown className="w-3 h-3 text-slate-400" />
                  </button>

                  {langMenuOpen && (
                    <>
                      <div className="fixed inset-0 z-40" onClick={() => setLangMenuOpen(false)} />
                      <div className="absolute right-0 mt-1.5 w-32 bg-white rounded-xl shadow-lg border border-slate-200/90 py-1 z-50">
                        {languages.map((lang) => (
                          <button
                            key={lang.code}
                            onClick={() => {
                              onSelectLanguage(lang.code);
                              setLangMenuOpen(false);
                            }}
                            className={`w-full px-3 py-1.5 text-xs text-left flex items-center justify-between hover:bg-sky-50 transition-colors ${
                              currentLanguage === lang.code ? 'text-sky-600 font-bold bg-sky-50/50' : 'text-slate-700 font-medium'
                            }`}
                          >
                            <span>{lang.name}</span>
                            <span className="text-[10px] text-slate-400 font-mono">{lang.code}</span>
                          </button>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          </section>
        );
      };

      // Slim Dynamic Balance Card ($GRAM Pill Text Smaller)
      const DynamicBalanceCard = ({ starBalance, tokenBalance, dict }) => {
        const formattedStars = starBalance.toLocaleString();
        const displayGram = tokenBalance.toFixed(3);

        return (
          <div className="w-full">
            <div className="relative overflow-hidden rounded-[16px] bg-gradient-to-r from-white via-white to-sky-50/95 border border-white shadow-[0_2px_8px_rgba(56,189,248,0.06)] px-3.5 py-2">
              <div className="flex items-center justify-between gap-2 mb-1">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400 whitespace-nowrap">
                  {dict.totalBalance}
                </span>
                
                <div className="inline-flex items-center gap-1 text-[10.5px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200/70 shrink-0">
                  <Icons.ShieldCheck className="w-3.5 h-3.5" />
                  <span>{dict.verified}</span>
                </div>
              </div>

              <div className="flex items-center justify-between gap-2.5">
                <div className="flex items-center gap-2.5 min-w-0">
                  <div className="relative flex items-center justify-center shrink-0">
                    <Coin3DIcon size={36} idPrefix="balance-main" floating={true} glow={true} />
                  </div>
                  <div className="flex items-baseline gap-1 flex-wrap">
                    <span className="font-display font-extrabold text-[23px] text-slate-900 tracking-tight tabular-nums leading-none">
                      {formattedStars}
                    </span>
                    <span className="text-[12px] font-extrabold text-sky-600">PTS</span>
                    
                    {/* Small Elegant $GRAM Badge */}
                    <span className="inline-flex items-center px-1.5 py-0.5 rounded-full bg-sky-100/90 text-sky-800 text-[9.5px] font-extrabold border border-sky-200/70 ml-1">
                      ≈ {displayGram} $GRAM
                    </span>
                  </div>
                </div>

                <div className="shrink-0 text-right">
                  <span className="text-[10px] text-slate-400 font-semibold tracking-tight whitespace-nowrap block">
                    10,000 PTS = 1 $GRAM
                  </span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const BottomNavBar = ({ activeTab, onSelectTab, hasCheckedInToday }) => {
        const tabs = [
          { id: 'home', label: 'Home', icon: Icons.Home },
          { id: 'checkin', label: 'Check-in', icon: Icons.Calendar, isCheckin: true },
          { id: 'frens', label: 'Frens', icon: Icons.Users },
          { id: 'wallet', label: 'Wallet', icon: Icons.Wallet },
        ];

        return (
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-sky-100/90 shadow-[0_-3px_15px_rgba(56,189,248,0.08)] px-4 pb-2 pt-1.5 transition-all">
            <div className="max-w-md mx-auto grid grid-cols-4 items-center justify-around">
              {tabs.map((tab) => {
                const IconComponent = tab.icon;
                const isActive = activeTab === tab.id;

                return (
                  <button
                    key={tab.id}
                    onClick={() => onSelectTab(tab.id)}
                    className={`relative flex flex-col items-center justify-center py-1 px-1 min-h-[46px] rounded-xl transition-all duration-200 cursor-pointer active:scale-90 ${
                      isActive ? 'text-sky-600' : 'text-slate-400 hover:text-slate-600'
                    }`}
                  >
                    {isActive && (
                      <span className="absolute -top-1 w-6 h-1 rounded-full bg-gradient-to-r from-sky-400 to-blue-600" />
                    )}

                    <div className="relative flex items-center justify-center">
                      <IconComponent className={`w-5 h-5 transition-transform duration-200 ${isActive ? 'scale-110' : ''}`} />
                      
                      {tab.isCheckin && (
                        !hasCheckedInToday ? (
                          <span className="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                            <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-400 border border-white"></span>
                          </span>
                        ) : (
                          <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full border border-white shadow-xs"></span>
                        )
                      )}
                    </div>

                    <span className={`text-[11px] font-semibold tracking-tight mt-0.5 ${isActive ? 'font-bold text-sky-600' : 'text-slate-500'}`}>
                      {tab.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </nav>
        );
      };

      const QuickActionsGrid = ({
        adReward,
        checkInReward,
        streakDays,
        hasCheckedInToday,
        userLevel,
        currentInvites,
        requiredInvites,
        completedTasksToday,
        dailyTaskLimit,
        adsWatchedToday,
        onWatchAdClick,
        onCheckInClick,
        onInviteClick,
        onTasksClick,
        dict,
      }) => {
        const invitePercentage = Math.min(100, Math.round((currentInvites / requiredInvites) * 100));
        const taskPercentage = Math.min(100, Math.round((completedTasksToday / dailyTaskLimit) * 100));

        return (
          <div className="w-full">
            <div className="grid grid-cols-2 gap-2">
              <div onClick={onWatchAdClick} role="button" className="group relative flex flex-col justify-between p-2.5 rounded-[15px] bg-white border border-sky-100 shadow-[0_2px_8px_rgba(56,189,248,0.06)] active:scale-[0.98] transition-all cursor-pointer overflow-hidden min-h-[76px]">
                <div className="flex items-start justify-between">
                  <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-sky-400 to-blue-500 flex items-center justify-center text-white shadow-xs">
                    <Icons.PlayCircle className="w-4 h-4 stroke-white" />
                  </div>
                  <div className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-sky-50 border border-sky-200/80 text-sky-700 text-[11px] font-extrabold tabular-nums">
                    <Coin3DIcon size={11} idPrefix="ad-reward" />
                    <span>+{adReward}</span>
                  </div>
                </div>
                <div className="mt-1">
                  <div className="flex items-center justify-between">
                    <h3 className="font-display font-bold text-slate-800 text-[12px] group-hover:text-sky-600 transition-colors leading-tight">{dict.watchAd}</h3>
                    <Icons.ChevronRight className="w-3.5 h-3.5 text-slate-300" />
                  </div>
                  <p className="text-[11px] text-slate-500 font-semibold mt-0.5 truncate">
                    <strong className="text-sky-600 font-bold">{adsWatchedToday}/10 Watched</strong>
                  </p>
                </div>
              </div>

              <div onClick={onCheckInClick} role="button" className="group relative flex flex-col justify-between p-2.5 rounded-[15px] bg-white border border-sky-100 shadow-[0_2px_8px_rgba(56,189,248,0.06)] active:scale-[0.98] transition-all cursor-pointer overflow-hidden min-h-[76px]">
                <div className="flex items-start justify-between">
                  <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-xs">
                    <Icons.CalendarCheck className="w-4 h-4" />
                  </div>
                  <div className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-sky-50 border border-sky-200/80 text-sky-700 text-[11px] font-extrabold tabular-nums">
                    <Coin3DIcon size={11} idPrefix="checkin-reward" />
                    <span>+{checkInReward}</span>
                  </div>
                </div>
                <div className="mt-1">
                  <div className="flex items-center justify-between">
                    <h3 className="font-display font-bold text-slate-800 text-[12px] group-hover:text-sky-600 transition-colors leading-tight">{dict.dailyCheckIn}</h3>
                    <Icons.ChevronRight className="w-3.5 h-3.5 text-slate-300" />
                  </div>
                  <div className="flex items-center gap-1 text-[11px] font-semibold text-blue-600 mt-0.5">
                    <Icons.Flame className="w-3 h-3 text-blue-500" fill="#0284c7" />
                    <span>{dict.streak} {streakDays}</span>
                    {hasCheckedInToday && <span className="text-[10px] text-emerald-600 font-bold ml-auto">Done</span>}
                  </div>
                </div>
              </div>

              <div onClick={onInviteClick} role="button" className="group relative flex flex-col justify-between p-2.5 rounded-[15px] bg-white border border-sky-100 shadow-[0_2px_8px_rgba(56,189,248,0.06)] active:scale-[0.98] transition-all cursor-pointer overflow-hidden min-h-[76px]">
                <div className="flex items-start justify-between">
                  <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-xs">
                    <Icons.Users className="w-4 h-4" />
                  </div>
                  <span className="text-[10.5px] font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-200/70 tabular-nums">
                    Lv.{userLevel}
                  </span>
                </div>
                <div className="mt-1">
                  <div className="flex items-center justify-between">
                    <h3 className="font-display font-bold text-slate-800 text-[12px] group-hover:text-indigo-600 transition-colors leading-tight">{dict.referralLevel}</h3>
                    <span className="text-[10px] font-extrabold text-indigo-600">+100 PTS</span>
                  </div>
                  <div className="mt-1 space-y-0.5">
                    <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                      <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-500" style={{ width: `${invitePercentage}%` }} />
                    </div>
                    <div className="flex justify-between items-center text-[10px] text-slate-500 font-medium">
                      <span>Perks</span>
                      <span className="font-semibold text-slate-700 tabular-nums">{currentInvites}/{requiredInvites} frens</span>
                    </div>
                  </div>
                </div>
              </div>

              <div onClick={onTasksClick} role="button" className="group relative flex flex-col justify-between p-2.5 rounded-[15px] bg-white border border-sky-100 shadow-[0_2px_8px_rgba(56,189,248,0.06)] active:scale-[0.98] transition-all cursor-pointer overflow-hidden min-h-[76px]">
                <div className="flex items-start justify-between">
                  <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-emerald-400 to-teal-600 flex items-center justify-center text-white shadow-xs">
                    <Icons.CheckCircle2 className="w-4 h-4" />
                  </div>
                  <span className="text-[10.5px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full border border-teal-200/70 tabular-nums">
                    {completedTasksToday}/{dailyTaskLimit} Done
                  </span>
                </div>
                <div className="mt-1">
                  <div className="flex items-center justify-between">
                    <h3 className="font-display font-bold text-slate-800 text-[12px] group-hover:text-teal-600 transition-colors leading-tight">{dict.dailyTasks}</h3>
                    <Icons.ChevronRight className="w-3.5 text-slate-300" />
                  </div>
                  <div className="mt-1 space-y-0.5">
                    <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                      <div className="bg-gradient-to-r from-teal-400 to-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${taskPercentage}%` }} />
                    </div>
                    <div className="flex items-center justify-between text-[10px] text-slate-500 font-medium">
                      <span>200 PTS/task</span>
                      <span className="font-bold text-teal-600">Max {dailyTaskLimit}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const BountyTasksSection = ({ tasks, completedTasksList = [], onStartTask, onPostBountyClick, dict }) => {
        const [selectedCategory, setSelectedCategory] = useState('All');
        const categories = ['All', 'Partners', 'Social', 'Web3', 'Daily'];

        const visibleTasks = tasks.filter((task) => {
          if (completedTasksList.includes(task.id) || task.status === 'completed') return false;
          if (selectedCategory !== 'All' && task.category !== selectedCategory) return false;
          return true;
        });

        const renderIcon = (type) => {
          switch (type?.toLowerCase()) {
            case 'telegram': return <Icons.Telegram className="w-7 h-7 shrink-0 drop-shadow-xs" />;
            case 'twitter': return <Icons.Twitter className="w-7 h-7 shrink-0 drop-shadow-xs" />;
            case 'youtube': return <Icons.Youtube className="w-7 h-7 shrink-0 drop-shadow-xs" />;
            case 'facebook': return <Icons.Facebook className="w-7 h-7 shrink-0 drop-shadow-xs" />;
            case 'instagram': return <Icons.Instagram className="w-7 h-7 shrink-0 drop-shadow-xs" />;
            case 'bot': return <Icons.Bot className="w-7 h-7 shrink-0 drop-shadow-xs" />;
            case 'others':
            default: return <Icons.Globe className="w-7 h-7 shrink-0 drop-shadow-xs" />;
          }
        };

        return (
          <section id="bounty-section" className="w-full pt-1 pb-4">
            <div className="flex items-center justify-between gap-2 mb-1.5">
              <div className="flex items-center gap-2">
                <h2 className="font-display font-extrabold text-slate-900 text-[15px] tracking-tight">{dict.activeBounties}</h2>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-700">200 PTS each</span>
              </div>
              
              <button
                onClick={onPostBountyClick}
                className="flex items-center gap-1 px-3 py-1 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 text-white rounded-full text-[12px] font-bold transition-all shadow-xs shadow-sky-500/30 active:scale-95 cursor-pointer"
              >
                <Icons.Plus className="w-3.5 h-3.5 stroke-[2.5]" />
                <span>POST</span>
              </button>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1.5">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3 py-1 text-[11.5px] font-semibold rounded-full whitespace-nowrap transition-all cursor-pointer ${
                    selectedCategory === cat
                      ? 'bg-sky-500 text-white shadow-xs shadow-sky-500/30'
                      : 'bg-white/80 hover:bg-white text-slate-600 border border-sky-100'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="space-y-1.5">
              {visibleTasks.length === 0 ? (
                <div className="p-4 rounded-[16px] bg-white/90 border border-sky-100 text-center shadow-xs">
                  <span className="text-2xl mb-1 block">🎉</span>
                  <h4 className="font-display font-bold text-slate-800 text-[13px]">All Bounties Completed!</h4>
                  <p className="text-[11px] text-slate-500 mt-0.5">Check back later for newly published missions.</p>
                </div>
              ) : (
                visibleTasks.map((task) => (
                  <div
                    key={task.id}
                    className="py-2 px-3 rounded-[14px] bg-white border border-sky-100/90 shadow-[0_1px_6px_rgba(56,189,248,0.05)] flex items-center justify-between gap-2.5 transition-all hover:border-sky-300"
                  >
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="w-8 h-8 rounded-xl flex items-center justify-center shrink-0">
                        {renderIcon(task.iconType)}
                      </div>
                      <div className="min-w-0">
                        <div className="flex items-center gap-1 flex-wrap">
                          <span className="text-[10px] font-bold text-sky-600 uppercase tracking-wider">{task.category}</span>
                          {task.partnerName && <span className="text-[10px] text-slate-400 font-medium">· {task.partnerName}</span>}
                        </div>
                        <h4 className="font-display font-bold text-slate-800 text-[13px] leading-tight truncate">{task.title}</h4>
                        <div className="inline-flex items-center gap-1 mt-0.5 text-[10.5px] font-extrabold text-sky-700 bg-sky-50 px-2 py-0.5 rounded-full border border-sky-200/60 tabular-nums">
                          <Coin3DIcon size={11} idPrefix={`task-coin-${task.id}`} />
                          <span>+{task.reward || 200} PTS</span>
                        </div>
                      </div>
                    </div>

                    <div className="shrink-0">
                      {task.status === 'verifying' ? (
                        <button disabled className="flex items-center gap-1 px-3 py-1 bg-sky-100 text-sky-800 rounded-full text-[11.5px] font-bold transition-all whitespace-nowrap">
                          <Icons.Loader2 className="w-3.5 h-3.5 animate-spin text-sky-600" />
                          <span>Checking (3s)</span>
                        </button>
                      ) : (
                        <button
                          onClick={() => onStartTask(task.id, task.actionUrl || task.url)}
                          className="flex items-center gap-1 px-3.5 py-1 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 text-white rounded-full text-[11.5px] font-bold transition-all shadow-xs active:scale-95 whitespace-nowrap cursor-pointer"
                        >
                          <span>{task.actionText || 'Start'}</span>
                          <Icons.ExternalLink className="w-3 h-3 opacity-80" />
                        </button>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          </section>
        );
      };

      const PostBountyModal = ({ isOpen, onClose, starBalance, walletAddress, onDeductPts, onSubmitBounty, showToast }) => {
        const [title, setTitle] = useState('');
        const [category, setCategory] = useState('Social');
        const [iconType, setIconType] = useState('telegram');
        const [actionText, setActionText] = useState('Start');
        const [actionUrl, setActionUrl] = useState('');
        const [currency, setCurrency] = useState('STARS');
        const [impressions, setImpressions] = useState(100);
        const [isSubmitting, setIsSubmitting] = useState(false);

        if (!isOpen) return null;

        const calcCostValue = () => {
          const ratio = (impressions - 100) / (10000 - 100);
          if (currency === 'GRAM') {
            return Number((1 + ratio * (20 - 1)).toFixed(2));
          } else if (currency === 'STARS') {
            return Math.round(300 + ratio * (6000 - 300));
          } else {
            return Math.round(10000 + ratio * (200000 - 10000));
          }
        };

        const calcDisplayPrice = () => {
          const val = calcCostValue();
          if (currency === 'GRAM') return `${val} $GRAM`;
          if (currency === 'STARS') return `${val} Stars`;
          return `${val.toLocaleString()} PTS`;
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!title.trim() || !actionUrl.trim()) return;

          const cost = calcCostValue();

          if (currency === 'GRAM') {
            if (!walletAddress) {
              showToast('⚠️ Please connect your TON wallet to pay $GRAM!');
              if (window.tonConnectUIInstance) {
                window.tonConnectUIInstance.openModal();
              }
              return;
            }

            setIsSubmitting(true);
            showToast('Fetching secure gateway info...');
            try {
              const payInfoRes = await fetch('/api/tasks?action=payment_info');
              const payInfoData = await payInfoRes.json().catch(() => ({}));
              const backendReceiver = payInfoData.receiverAddress;

              if (!backendReceiver) throw new Error('Gateway unreachable');

              const nanoAmount = Math.round(cost * 1e9).toString();
              const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [{ address: backendReceiver, amount: nanoAmount }]
              };

              if (window.tonConnectUIInstance) {
                await window.tonConnectUIInstance.sendTransaction(transaction);
                showToast('✅ Payment received in $GRAM! Publishing mission...');
                
                await onSubmitBounty({
                  title: title.trim(),
                  description: `Complete this ${category.toLowerCase()} mission to earn ⭐ stars!`,
                  category,
                  reward: 200,
                  actionText: actionText.trim() || 'Start Mission',
                  actionUrl: actionUrl.trim() || 'https://t.me/ToBOOST_Ai',
                  iconType,
                  paidWith: 'GRAM',
                  cost: cost
                });
                onClose();
              }
            } catch (err) {
              showToast('❌ Wallet payment was cancelled or failed.');
            } finally {
              setIsSubmitting(false);
            }
            return;
          }

          else if (currency === 'PTS') {
            if (starBalance < cost) {
              showToast(`❌ Insufficient PTS! You need ${cost.toLocaleString()} PTS.`);
              return;
            }

            setIsSubmitting(true);
            onDeductPts(cost);
            showToast(`✅ ${cost.toLocaleString()} PTS deducted for Boost!`);

            try {
              await onSubmitBounty({
                title: title.trim(),
                description: `Complete this ${category.toLowerCase()} mission to earn ⭐ stars!`,
                category,
                reward: 200,
                actionText: actionText.trim() || 'Start Mission',
                actionUrl: actionUrl.trim() || 'https://t.me/ToBOOST_Ai',
                iconType,
                paidWith: 'PTS',
                cost: cost,
                impressions: impressions
              });
              onClose();
            } catch (err) {
              showToast('Error publishing task.');
            } finally {
              setIsSubmitting(false);
            }
            return;
          }

          else if (currency === 'STARS') {
            setIsSubmitting(true);
            showToast('Opening Stars Payment Sheet...');

            try {
              const invRes = await fetch('/api/create-stars-invoice', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-telegram-init-data': tg?.initData || ''
                },
                body: JSON.stringify({
                  title: title.trim(),
                  starsCost: cost,
                  impressions,
                  actionUrl: actionUrl.trim()
                })
              });
              
              const invData = await invRes.json().catch(() => ({}));

              if (invData && invData.invoiceLink && window.Telegram?.WebApp?.openInvoice) {
                window.Telegram.WebApp.openInvoice(invData.invoiceLink, async (status) => {
                  if (status === 'paid') {
                    showToast('⭐️ Stars Payment Confirmed! Publishing...');
                    await onSubmitBounty({
                      title: title.trim(),
                      description: `Complete this ${category.toLowerCase()} mission to earn ⭐ stars!`,
                      category,
                      reward: 200,
                      actionText: actionText.trim() || 'Start Mission',
                      actionUrl: actionUrl.trim() || 'https://t.me/ToBOOST_Ai',
                      iconType,
                      paidWith: 'STARS',
                      cost: cost
                    });
                    onClose();
                  } else if (status === 'cancelled') {
                    showToast('Payment was cancelled.');
                  } else {
                    showToast('Stars checkout pending or failed.');
                  }
                  setIsSubmitting(false);
                });
                return;
              } else {
                showToast(invData?.error || 'Stars invoice gateway unavailable');
                setIsSubmitting(false);
                return;
              }
            } catch (err) {
              showToast('Stars gateway error. Please try again.');
              setIsSubmitting(false);
              return;
            }
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-sm animate-in fade-in duration-200">
            <div className="relative w-full max-w-sm rounded-[24px] bg-white border border-sky-100 shadow-2xl p-5 overflow-hidden max-h-[90vh] overflow-y-auto no-scrollbar text-slate-900">
              
              <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <div className="flex items-center gap-2">
                  <div className="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-emerald-700 text-[12px] font-bold tracking-wide">
                    <span className="relative flex h-2 w-2">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span>LIVE</span>
                  </div>
                  <div>
                    <h3 className="font-display font-bold text-slate-900 text-[15px]">Post Bounty Campaign</h3>
                  </div>
                </div>
                <button onClick={onClose} className="p-1 rounded-full text-slate-400 hover:text-slate-600">
                  <Icons.X className="w-5 h-5" />
                </button>
              </div>

              <form onSubmit={handleSubmit} className="space-y-3">
                <div>
                  <label className="block text-[13px] font-bold text-slate-700 mb-1">Task Title *</label>
                  <input
                    type="text"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="e.g. Join Official Community Channel"
                    className="w-full px-3 py-2 text-[13px] rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none focus:border-sky-500 text-slate-900 font-medium"
                    required
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[13px] font-bold text-slate-700 mb-1">Category</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full px-3 py-2 text-[13px] rounded-xl border border-slate-300 bg-slate-50 text-slate-900 font-semibold focus:outline-none focus:border-sky-500"
                    >
                      <option value="Social" className="text-slate-900 bg-white">Social</option>
                      <option value="Partners" className="text-slate-900 bg-white">Partners</option>
                      <option value="Web3" className="text-slate-900 bg-white">Web3</option>
                      <option value="Daily" className="text-slate-900 bg-white">Daily</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[13px] font-bold text-slate-700 mb-1">Icon</label>
                    <select
                      value={iconType}
                      onChange={(e) => setIconType(e.target.value)}
                      className="w-full px-3 py-2 text-[13px] rounded-xl border border-slate-300 bg-slate-50 text-slate-900 font-semibold focus:outline-none focus:border-sky-500"
                    >
                      <option value="telegram" className="text-slate-900 bg-white">Telegram</option>
                      <option value="twitter" className="text-slate-900 bg-white">X / Twitter</option>
                      <option value="youtube" className="text-slate-900 bg-white">YouTube</option>
                      <option value="facebook" className="text-slate-900 bg-white">Facebook</option>
                      <option value="instagram" className="text-slate-900 bg-white">Instagram</option>
                      <option value="others" className="text-slate-900 bg-white">Others</option>
                    </select>
                  </div>
                </div>

                <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200">
                  <div className="flex justify-between items-center text-[13px] font-bold mb-1">
                    <span className="text-slate-700">Target Impressions</span>
                    <span className="text-sky-600 tabular-nums">{impressions.toLocaleString()} Views</span>
                  </div>
                  <input
                    type="range"
                    min="100"
                    max="10000"
                    step="100"
                    value={impressions}
                    onChange={(e) => setImpressions(Number(e.target.value))}
                    className="w-full accent-sky-500 cursor-pointer"
                  />

                  <div className="mt-2.5 pt-2 border-t border-slate-200 flex items-center justify-between">
                    <div>
                      <span className="text-[11px] text-slate-500 block mb-1 font-semibold">Payment Method:</span>
                      <div className="flex gap-1.5">
                        <button
                          key="STARS"
                          type="button"
                          onClick={() => setCurrency('STARS')}
                          className={`px-2.5 py-1 text-[11px] font-bold rounded-lg transition ${
                            currency === 'STARS' ? 'bg-amber-500 text-white shadow-xs' : 'bg-white text-slate-700 border border-slate-300'
                          }`}
                        >
                          ⭐️ Stars
                        </button>
                        <button
                          key="GRAM"
                          type="button"
                          onClick={() => setCurrency('GRAM')}
                          className={`px-2.5 py-1 text-[11px] font-bold rounded-lg transition ${
                            currency === 'GRAM' ? 'bg-sky-500 text-white shadow-xs' : 'bg-white text-slate-700 border border-slate-300'
                          }`}
                        >
                          $GRAM
                        </button>
                        <button
                          key="PTS"
                          type="button"
                          onClick={() => setCurrency('PTS')}
                          className={`px-2.5 py-1 text-[11px] font-bold rounded-lg transition ${
                            currency === 'PTS' ? 'bg-emerald-500 text-white shadow-xs' : 'bg-white text-slate-700 border border-slate-300'
                          }`}
                        >
                          Free PTS
                        </button>
                      </div>
                    </div>

                    <div className="text-right">
                      <span className="text-[11px] text-emerald-600 font-bold block">Cost</span>
                      
<span className="font-display font-extrabold text-[12px] whitespace-nowrap text-slate-900 block">{calcDisplayPrice()}</span>
                    </div>
                  </div>

                  {currency === 'GRAM' && !walletAddress && (
                    <div className="mt-2 p-2 bg-amber-50 rounded-xl border border-amber-200/80 flex items-center justify-between">
                      <span className="text-[10.5px] text-amber-800 font-semibold">Wallet connection required</span>
                      <button
                        type="button"
                        onClick={() => window.tonConnectUIInstance?.openModal()}
                        className="px-2 py-0.5 bg-amber-500 text-white text-[10px] font-bold rounded-md"
                      >
                        Connect
                      </button>
                    </div>
                  )}
                </div>

                <div>
                  <label className="block text-[13px] font-bold text-slate-700 mb-1">Target Link / URL</label>
                  <input
                    type="url"
                    value={actionUrl}
                    onChange={(e) => setActionUrl(e.target.value)}
                    placeholder="e.g. https://t.me/ToBOOST_Ai"
                    className="w-full px-3 py-2 text-[13px] rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-slate-900 font-medium"
                    required
                  />
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full py-3 bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-[13px] rounded-xl shadow-md active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-1.5 disabled:opacity-50"
                >
                  <Icons.Send className="w-4 h-4" />
                  <span>
                    {isSubmitting
                      ? 'Processing Payment...'
                      : currency === 'STARS'
                      ? `Confirm & Pay with Stars (${calcDisplayPrice()})`
                      : currency === 'GRAM'
                      ? `Pay & Publish with $GRAM (${calcDisplayPrice()})`
                      : `Boost for Free (${calcDisplayPrice()})`}
                  </span>
                </button>
              </form>
            </div>
          </div>
        );
      };

      const LevelPerksModal = ({ isOpen, onClose, userLevel, currentInvites, requiredInvites, multiplier }) => {
        if (!isOpen) return null;

        const levels = [
          { lvl: 1, title: 'Star Hunter', perks: 'Base 5 daily tasks, 1.0x booster multiplier' },
          { lvl: 2, title: 'Bounty Explorer', perks: '10 daily tasks (5 referrals required), 1.2x boost' },
          { lvl: 3, title: 'Cosmic Collector', perks: '15 daily tasks (10 referrals required), 1.4x boost' },
          { lvl: 4, title: 'Galaxy Pioneer', perks: '20 daily tasks (15 referrals required), 1.6x multiplier' },
          { lvl: 5, title: 'ToBOOST Master', perks: 'Maximum 20 tasks, 2.0x multiplier, priority airdrop' },
        ];

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
            <div className="relative w-full max-w-sm rounded-[24px] bg-white border border-sky-100 shadow-2xl p-5 overflow-hidden">
              <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-2xl bg-sky-50 border border-sky-200 flex items-center justify-center">
                    <Icons.Trophy className="w-5 h-5 text-sky-600" />
                  </div>
                  <div>
                    <h3 className="font-display font-black text-slate-900 text-base">Level {userLevel} Perks</h3>
                    <p className="text-[12px] text-slate-400">Current Multiplier: <strong className="text-sky-600">{multiplier}x</strong></p>
                  </div>
